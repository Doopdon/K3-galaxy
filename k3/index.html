<!DOCTYPE html>
<html>

<head>
    <title>K3</title>

    <style>
        html,
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }


        #controls {

            position: fixed;

            top: 20px;
            left: 20px;

            z-index: 10000;

            padding: 14px 18px;

            color: white;

            background: rgba(0, 0, 0, 0.55);

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 8px;

            font-family:
                monospace;

            font-size: 14px;

            line-height: 1.6;

            user-select: none;

            pointer-events: none;

            backdrop-filter:
                blur(4px);
        }


        #controls .title {

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 6px;
        }


        #controls .key {

            display: inline-block;

            min-width: 58px;

            color: #ffffff;

            font-weight: bold;
        }


        #hideHint {

            position: fixed;

            bottom: 15px;
            left: 15px;

            z-index: 10000;

            color: rgba(255, 255, 255, 0.55);

            font-family: monospace;

            font-size: 12px;

            user-select: none;

            pointer-events: none;
        }

        #mobileMoveControls {

            display: none;

            position: fixed;

            left: 20px;
            bottom: 20px;

            width: 150px;
            height: 150px;

            z-index: 15000;

            user-select: none;

            touch-action: none;
        }


        .moveButton {

            position: absolute;

            width: 52px;
            height: 52px;

            border-radius: 50%;

            border:
                1px solid rgba(255, 255, 255, 0.45);

            background:
                rgba(0, 0, 0, 0.5);

            color: white;

            font-size: 24px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 0;

            touch-action: none;

            -webkit-tap-highlight-color:
                transparent;
        }


        .moveButton:active {

            background:
                rgba(255, 255, 255, 0.25);
        }


        .moveUp {

            top: 0;
            left: 49px;
        }


        .moveDown {

            bottom: 0;
            left: 49px;
        }


        .moveLeft {

            left: 0;
            top: 49px;
        }


        .moveRight {

            right: 0;
            top: 49px;
        }
    </style>

</head>


<body>
    <div id="mobileMoveControls">

        <button class="moveButton moveUp" data-key="w">
            ▲
        </button>

        <button class="moveButton moveLeft" data-key="a">
            ◀
        </button>

        <button class="moveButton moveRight" data-key="d">
            ▶
        </button>

        <button class="moveButton moveDown" data-key="s">
            ▼
        </button>

    </div>

    <div id="mobileLookControls">

        <button class="lookButton lookUp" data-key="arrowup">
            ▲
        </button>

        <button class="lookButton lookLeft" data-key="arrowleft">
            ◀
        </button>

        <button class="lookButton lookRight" data-key="arrowright">
            ▶
        </button>

        <button class="lookButton lookDown" data-key="arrowdown">
            ▼
        </button>

    </div>

    <div id="landscapeNotice">
        <div class="phoneIcon">
            ↻
        </div>

        <div class="landscapeTitle">
            Best enjoyed in landscape
        </div>

        <div class="landscapeText">
            Turn your phone sideways
        </div>
    </div>

    <!-- ========================================
         MOVEMENT INSTRUCTIONS
         ======================================== -->

    <div id="controls">

        <div class="title">
            K3 Navigation
        </div>

        <div>
            <span class="key">WASD</span>
            Move
        </div>

        <div>
            <span class="key">Mouse</span>
            Look
        </div>

        <div>
            <span class="key">Click</span>
            Capture mouse
        </div>

        <div>
            <span class="key">F / R</span>
            Faster / Slower
        </div>

        <div>
            <span class="key">Q / E</span>
            Roll
        </div>

        <div>
            <span class="key">Arrows</span>
            Look
        </div>

        <div>
            <span class="key">H</span>
            Hide controls
        </div>

    </div>


    <div id="hideHint">
        H — Show / Hide Controls
    </div>


    <script type="module">

        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";
        import { EffectComposer } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/EffectComposer.js/+esm";
        import { RenderPass } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/RenderPass.js/+esm";
        import { UnrealBloomPass } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/UnrealBloomPass.js/+esm";


        // Make them available to ordinary JS files
        window.THREE = THREE;
        window.EffectComposer = EffectComposer;
        window.RenderPass = RenderPass;
        window.UnrealBloomPass = UnrealBloomPass;


        // ========================================
        // MOBILE LANDSCAPE NOTICE
        // ========================================

        const landscapeNotice =
            document.getElementById(
                "landscapeNotice"
            );


        function isProbablyPhone() {

            const hasTouch =
                navigator.maxTouchPoints > 0;


            const smallestScreenDimension =
                Math.min(
                    screen.width,
                    screen.height
                );


            // Most phones are well below this.
            // Tablets usually start getting above it.
            const phoneSized =
                smallestScreenDimension <= 600;


            return (
                hasTouch &&
                phoneSized
            );
        }


        function updateLandscapeNotice() {

            const isPhone =
                isProbablyPhone();


            const isPortrait =
                window.innerHeight >
                window.innerWidth;


            if (
                isPhone &&
                isPortrait
            ) {

                landscapeNotice.style.display =
                    "flex";

            } else {

                landscapeNotice.style.display =
                    "none";
            }
        }


        updateLandscapeNotice();


        window.addEventListener(
            "resize",
            updateLandscapeNotice
        );


        window.addEventListener(
            "orientationchange",
            updateLandscapeNotice
        );

        // ========================================
        // CONTROLS HUD
        // ========================================

        const controls =
            document.getElementById(
                "controls"
            );


        let controlsVisible =
            true;


        window.addEventListener(
            "keydown",
            event => {

                if (
                    event.key.toLowerCase() === "h"
                    &&
                    !event.repeat
                ) {

                    controlsVisible =
                        !controlsVisible;


                    controls.style.display =
                        controlsVisible
                            ? "block"
                            : "none";
                }
            }
        );


        window.colliderDebugMaterial =
            new THREE.MeshBasicMaterial({

                color: 0x00ff00,

                wireframe: true,

                transparent: true,

                opacity: 0.8,

                depthTest: false,

                depthWrite: false
            });


        window.showCollider = function (collider) {

            if (!collider.geometry) {
                return;
            }


            const debugMesh =
                new THREE.Mesh(
                    collider.geometry,
                    colliderDebugMaterial
                );


            // Slightly enlarge it so the wireframe
            // doesn't fight with the visible surface.
            debugMesh.scale.setScalar(
                1.01
            );


            debugMesh.renderOrder =
                999;


            // Since it is a child of the collider,
            // it automatically gets the exact same
            // position + rotation + scale.
            collider.add(
                debugMesh
            );
        }


        function loadScript(path) {

            return new Promise((resolve, reject) => {

                const script =
                    document.createElement("script");

                script.src = path;

                script.onload = resolve;
                script.onerror = reject;

                document.body.appendChild(script);
            });
        }


        // Load in dependency order
        await loadScript(
            "helpers.js"
        );

        await loadScript(
            "engine/sceneDataClasses.js"
        );


        /// =======Scenes========

        await loadScript(
            "scenes/roomScene.js"
        );

        await loadScript(
            "scenes/cylindarScene.js"
        );

        await loadScript(
            "scenes/cityScene.js"
        );

        await loadScript(
            "scenes/mirrorScene.js"
        );

        await loadScript(
            "scenes/starSystemScene.js"
        );

        await loadScript(
            "scenes/galaxyScene.js"
        );


        window.mainSceneData =
            galaxySceneData;


        window.cam_position = [
            0,
            115,
            890
        ];


        window.cam_lookAt = [
            0,
            0,
            0
        ];


        await loadScript(
            "engine/spaceEngine.js"
        );


        // Everything now exists
        run();

    </script>

</body>
<style>
    #landscapeNotice {

        display: none;

        position: fixed;

        inset: 0;

        z-index: 20000;

        background: rgba(0, 0, 0, 0.88);

        color: white;

        font-family: monospace;

        text-align: center;

        align-items: center;

        justify-content: center;

        flex-direction: column;

        gap: 12px;

        user-select: none;
    }


    #landscapeNotice .phoneIcon {

        font-size: 60px;

        line-height: 1;

        margin-bottom: 8px;
    }


    #landscapeNotice .landscapeTitle {

        font-size: 22px;

        font-weight: bold;
    }


    #landscapeNotice .landscapeText {

        font-size: 14px;

        color: rgba(255, 255, 255, 0.7);
    }

    #mobileLookControls {

        display: none;

        position: fixed;

        right: 20px;
        bottom: 20px;

        width: 150px;
        height: 150px;

        z-index: 15000;

        user-select: none;

        touch-action: none;
    }


    .lookButton {

        position: absolute;

        width: 52px;
        height: 52px;

        border-radius: 50%;

        border:
            1px solid rgba(255, 255, 255, 0.45);

        background:
            rgba(0, 0, 0, 0.5);

        color: white;

        font-size: 24px;

        font-family: monospace;

        display: flex;

        align-items: center;
        justify-content: center;

        padding: 0;

        touch-action: none;

        -webkit-tap-highlight-color:
            transparent;
    }


    .lookButton:active {

        background:
            rgba(255, 255, 255, 0.25);
    }


    .lookUp {

        top: 0;
        left: 49px;
    }


    .lookDown {

        bottom: 0;
        left: 49px;
    }


    .lookLeft {

        left: 0;
        top: 49px;
    }


    .lookRight {

        right: 0;
        top: 49px;
    }
</style>

</html>
