<!DOCTYPE html>
<html>

<head>
    <title>Red Ball</title>
</head>

<body style="margin: 0; overflow: hidden;">

    <script type="module">

        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js";


        class StaticSceneData {
            constructor({ scale, timescale, disapearDistance, childScenes, getSubSceneData, populateScene, update }) {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000);
                this.camera.rotation.order = "YXZ";
                this.camera.position.z = 5;
                this.scale = scale;
                this.timescale = timescale;
                this.disapearDistance = disapearDistance;
                this.childScenes = childScenes;
                this.getSubSceneData = getSubSceneData ?? this.getSubSceneData;
                this.populateScene = populateScene ?? this.populateScene;
                this.update = update ?? this.update;
            }

            remove() {
                this.scene.clear();
                this.childScenes.forEach((scene) => scene.remove());
            }

            getSubSceneData(child) {
                // most scenes only have one child scene, so we can just return the first one
                return this.childScenes[0];
            }

            populateScene(position) {
                // Implement in subclasses
            }
            // Basic collision detection logic for all scenes
            checkCollision() {
                const disappearDistance = this.disapearDistance;
                const cameraPosition = this.camera.position;

                const children = this.orbitGroup
                    ? this.orbitGroup.children
                    : this.scene.children;

                this.scene.updateMatrixWorld(true);

                for (const child of children) {

                    const worldPosition = new THREE.Vector3();
                    child.getWorldPosition(worldPosition);

                    const distance = cameraPosition.distanceTo(worldPosition);

                    // Currently inside this object
                    if (child.userData.visited) {

                        if (distance > disappearDistance) {
                            this.getSubSceneData(child).remove();

                            child.visible = true;
                            child.userData.visited = false;
                        }
                        else {
                            return true; // still inside -> stay paused
                        }
                    }

                    // Entering
                    else if (distance < disappearDistance) {

                        child.userData.visited = true;
                        child.visible = false;
                        const subSceneData = this.getSubSceneData(child);
                        subSceneData.populateScene(
                            worldPosition.clone().multiplyScalar(
                                this.scale / subSceneData.scale
                            )
                        );

                        return true;
                    }
                }

                return false;
            }

            update() {
                // Implement in subclasses
            }
        }


        class RotatingSceneData extends StaticSceneData {

            constructor({
                rotationSpeed = 0.02,
                lockedRotationSpeed = 0.002,
                lockDistance = 1,
                populateGroup,
                getMainSceneData,
                ...baseOptions
            }) {

                super(baseOptions);

                this.rotationSpeed = rotationSpeed;
                this.lockedRotationSpeed = lockedRotationSpeed;
                this.lockDistance = lockDistance;

                this.populateGroup = populateGroup;
                this.getMainSceneData = getMainSceneData;

                this.orbitGroup = null;
                this.lockedObject = null;
                this.lastLockedPosition = new THREE.Vector3();
            }


            populateScene(position) {

                const group = new THREE.Group();

                group.position.copy(position);

                // Let this particular scene decide what goes in the group
                this.populateGroup.call(this, group);

                this.scene.add(group);

                this.orbitGroup = group;
            }


            checkCollision() {

                if (!this.orbitGroup) return false;

                this.scene.updateMatrixWorld(true);


                // Already locked
                if (this.lockedObject) {

                    const position = new THREE.Vector3();

                    this.lockedObject.getWorldPosition(position);

                    const distance =
                        this.camera.position.distanceTo(position);

                    if (distance > this.lockDistance) {

                        console.log("UNLOCKED");

                        this.lockedObject = null;

                        return false;
                    }

                    return true;
                }


                // Look for something to lock onto
                for (const object of this.orbitGroup.children) {

                    const position = new THREE.Vector3();

                    object.getWorldPosition(position);

                    const distance =
                        this.camera.position.distanceTo(position);

                    if (distance < this.lockDistance) {

                        console.log("LOCKED");

                        this.lockedObject = object;
                        this.lastLockedPosition.copy(position);

                        return true;
                    }
                }

                return false;
            }


            update() {

                if (!this.orbitGroup) return;

                const rotationAmount = this.lockedObject
                    ? this.lockedRotationSpeed
                    : this.rotationSpeed;


                // Rotate the reference frame
                this.orbitGroup.rotation.y +=
                    rotationAmount * this.timescale;

                this.scene.updateMatrixWorld(true);


                // Player inherits movement of locked object
                if (this.lockedObject) {

                    const newPosition = new THREE.Vector3();

                    this.lockedObject.getWorldPosition(newPosition);

                    const movement = newPosition
                        .clone()
                        .sub(this.lastLockedPosition);


                    const mainSceneData = this.getMainSceneData();


                    // Convert movement back to main-scene scale
                    mainSceneData.camera.position.add(
                        movement.multiplyScalar(
                            this.scale / mainSceneData.scale
                        )
                    );


                    // Rotate player's view with the reference frame
                    mainSceneData.camera.rotation.y +=
                        rotationAmount * this.timescale;


                    this.lastLockedPosition.copy(newPosition);
                }
            }


            remove() {

                super.remove();

                this.lockedObject = null;
                this.orbitGroup = null;
            }
        }


        class OrbitingSceneData extends StaticSceneData {

            constructor({
                rotationSpeed = 0.01,
                populateGroup,
                ...baseOptions
            }) {

                super(baseOptions);

                this.rotationSpeed = rotationSpeed;
                this.populateGroup = populateGroup;

                this.orbitGroup = null;
                this.pause = false;
            }


            populateScene(position) {

                const group = new THREE.Group();

                group.position.copy(position);

                this.populateGroup.call(this, group);

                this.scene.add(group);

                this.orbitGroup = group;
            }


            checkCollision() {

                // Use StaticSceneData's normal descend/leave logic
                this.pause = super.checkCollision();
            }


            update() {

                if (this.orbitGroup && !this.pause) {
                    this.orbitGroup.rotation.y +=
                        this.rotationSpeed * this.timescale;
                }
            }


            remove() {

                super.remove();

                this.orbitGroup = null;
                this.pause = false;
            }
        }

        function checkCollision(sceneData) {

            const disappearDistance = sceneData.disapearDistance;
            const cameraPosition = sceneData.camera.position;

            const children = sceneData.orbitGroup
                ? sceneData.orbitGroup.children
                : sceneData.scene.children;

            sceneData.scene.updateMatrixWorld(true);

            for (const child of children) {

                const worldPosition = new THREE.Vector3();
                child.getWorldPosition(worldPosition);

                const distance = cameraPosition.distanceTo(worldPosition);

                // Currently inside this object
                if (child.userData.visited) {

                    if (distance > disappearDistance) {
                        sceneData.getSubSceneData(child).remove();

                        child.visible = true;
                        child.userData.visited = false;
                    }
                    else {
                        return true; // still inside -> stay paused
                    }
                }

                // Entering
                else if (distance < disappearDistance) {

                    child.userData.visited = true;
                    child.visible = false;
                    const subSceneData = sceneData.getSubSceneData(child);
                    subSceneData.populateScene(
                        worldPosition.clone().multiplyScalar(
                            sceneData.scale / subSceneData.scale
                        )
                    );

                    return true;
                }
            }

            return false;
        }

        function generateCamera() {
            const camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000);
            camera.rotation.order = "YXZ";
            camera.position.z = 5;
            return camera;
        }

        const yelloCubeSceneData = new RotatingSceneData({

            scale: 0.001,
            timescale: 1,
            disapearDistance: 1,
            childScenes: [],

            rotationSpeed: 0.02,
            lockedRotationSpeed: 0.002,
            lockDistance: 1,

            getMainSceneData: () => mainSceneData,

            populateGroup: function (group) {

                for (let i = 0; i < 10; i++) {

                    const geometry =
                        new THREE.BoxGeometry(1, 1, 1);

                    const material =
                        new THREE.MeshBasicMaterial({
                            color: "yellow"
                        });

                    const cube =
                        new THREE.Mesh(geometry, material);

                    cube.position.set(
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10
                    );

                    group.add(cube);
                }
            }
        });
        // Green Sphere Scene
        const greenSphereSceneData = new OrbitingSceneData({

            scale: 0.01,
            timescale: 1,
            disapearDistance: 1,

            childScenes: [
                yelloCubeSceneData
            ],

            rotationSpeed: 0.01,

            getSubSceneData: function (child) {
                return yelloCubeSceneData;
            },

            populateGroup: function (group) {

                for (let i = 0; i < 10; i++) {

                    const sphereGeometry =
                        new THREE.SphereGeometry(1, 32, 32);

                    const sphereMaterial =
                        new THREE.MeshBasicMaterial({
                            color: "green"
                        });

                    const sphere = new THREE.Mesh(
                        sphereGeometry,
                        sphereMaterial
                    );

                    sphere.position.set(
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10
                    );

                    group.add(sphere);
                }
            }
        });

        // Red Sphere Scene
        const redSphereSceneData = new StaticSceneData({
            scale: .1,
            timescale: 1,
            disapearDistance: 1,
            childScenes: [greenSphereSceneData],
            populateScene: function (position) {
                for (let i = 0; i < 10; i++) {
                    const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);
                    const sphereMaterial = new THREE.MeshBasicMaterial({
                        color: "red"
                    });
                    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);

                    sphere.position.set(
                        position.x + Math.random() * 20 - 10,
                        position.y + Math.random() * 20 - 10,
                        position.z + Math.random() * 20 - 10
                    );

                    this.scene.add(sphere);
                }
            }
        });

        const orangeSphereSceneData = new StaticSceneData({
            scene: new THREE.Scene(),
            camera: generateCamera(),
            scale: .1,
            disapearDistance: 1,
            childScenes: [],
            remove: function () {
                this.scene.clear();
                this.childScenes.forEach((scene) => scene.remove());
            },
            populateScene: function (position) {
                for (let i = 0; i < 10; i++) {
                    const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);
                    const sphereMaterial = new THREE.MeshBasicMaterial({
                        color: "orange"
                    });
                    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);

                    sphere.position.set(
                        position.x + Math.random() * 20 - 10,
                        position.y + Math.random() * 20 - 10,
                        position.z + Math.random() * 20 - 10
                    );

                    this.scene.add(sphere);
                }
            }
        });


        // Cube Scene
        const mainSceneDataOld = {
            scene: new THREE.Scene(),
            camera: generateCamera(),
            scale: 1,
            disapearDistance: 1,
            childScenes: [redSphereSceneData, orangeSphereSceneData],
            checkCollision: function () {
                checkCollision(this)
            },
            getSubSceneData: function (child) {
                console.log("getSubSceneData", child.userData.id);
                if (child.userData.id % 2 === 0) {
                    return redSphereSceneData;
                } else {
                    return orangeSphereSceneData;
                }
            },
            populateScene: function () {
                for (let i = 0; i < 100; i++) {
                    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
                    const cubeMaterial1 = new THREE.MeshBasicMaterial({
                        color: "blue"
                    });

                    const cubeMaterial2 = new THREE.MeshBasicMaterial({
                        color: "purple"
                    });
                    const cubeMaterial = i % 2 ? cubeMaterial1 : cubeMaterial2;
                    const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);

                    cube.position.set(
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10
                    );

                    cube.userData.visited = false;
                    cube.userData.id = i;

                    this.scene.add(cube);
                }
            }
        }

        const mainSceneData = new StaticSceneData({
            scale: 1, // scale
            timescale: 1, // timescale
            disapearDistance: 1, // disapearDistance
            childScenes: [redSphereSceneData, orangeSphereSceneData],
            getSubSceneData: function (child) {
                console.log("getSubSceneData", child.userData.id);
                if (child.userData.id % 2 === 0) {
                    return redSphereSceneData;
                } else {
                    return orangeSphereSceneData;
                }
            },
            populateScene: function () {
                for (let i = 0; i < 100; i++) {
                    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
                    const cubeMaterial1 = new THREE.MeshBasicMaterial({
                        color: "blue"
                    });

                    const cubeMaterial2 = new THREE.MeshBasicMaterial({
                        color: "purple"
                    });
                    const cubeMaterial = i % 2 ? cubeMaterial1 : cubeMaterial2;
                    const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);

                    cube.position.set(
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10
                    );

                    cube.userData.visited = false;
                    cube.userData.id = i;

                    this.scene.add(cube);
                }
            }
        });




        // start sim
        const scenesData = [mainSceneData];

        function addChildScenes(parentSceneData) {
            // two loops to add child scenes and their children recursively
            parentSceneData.childScenes.forEach(childScene => {
                scenesData.push(childScene);
            });
            parentSceneData.childScenes.forEach(childScene => {
                addChildScenes(childScene);
            });
        }

        addChildScenes(mainSceneData)


        // Renderer
        const renderer = new THREE.WebGLRenderer();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.autoClear = false;

        document.body.appendChild(renderer.domElement);



        let keys = {};
        function addEventHandlers() {
            let mainCamera = scenesData[0].camera;
            addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
            addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

            renderer.domElement.addEventListener("click", () => renderer.domElement.requestPointerLock());

            addEventListener("mousemove", e => {
                if (document.pointerLockElement !== renderer.domElement) return;

                mainCamera.rotation.y -= e.movementX * 0.002;
                mainCamera.rotation.x -= e.movementY * 0.002;

                mainCamera.rotation.x = Math.max(
                    -Math.PI / 2,
                    Math.min(Math.PI / 2, mainCamera.rotation.x)
                );
            });


        }

        let speed = 0.1;
        function moveCamera() {
            let mainCamera = scenesData[0].camera;
            if (keys["w"]) mainCamera.translateZ(-speed);
            if (keys["s"]) mainCamera.translateZ(speed);
            if (keys["a"]) mainCamera.translateX(-speed);
            if (keys["d"]) mainCamera.translateX(speed);

            if (keys["f"]) speed *= 1.1;
            if (keys["r"]) speed /= 1.1;

            if (keys["arrowup"]) mainCamera.rotation.x += 0.01;
            if (keys["arrowdown"]) mainCamera.rotation.x -= 0.01;
            if (keys["arrowleft"]) mainCamera.rotation.y += 0.01;
            if (keys["arrowright"]) mainCamera.rotation.y -= 0.01;

            mainCamera.rotation.x = Math.max(
                -Math.PI / 2,
                Math.min(Math.PI / 2, mainCamera.rotation.x)
            );
        }

        scenesData[0].populateScene();

        addEventHandlers();

        function run() {
            setTimeout(() => {
                moveCamera();

                renderer.clear();
                scenesData.forEach((data, i) => {
                    if (i !== 0) {
                        data.camera.rotation.copy(scenesData[0].camera.rotation);
                        data.camera.position.copy(scenesData[0].camera.position).multiplyScalar(1 / data.scale);
                        renderer.clearDepth();
                    }
                    data.checkCollision?.();
                    data.update?.();

                    renderer.render(data.scene, data.camera);
                });
                run();
            }, 10);
        }
        run();


    </script>

</body>

</html>
