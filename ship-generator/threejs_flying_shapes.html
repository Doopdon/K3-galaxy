<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js — Flying Shapes Playground</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #10141b;
      font-family: system-ui, sans-serif;
    }

    #help {
      position: fixed;
      top: 16px;
      left: 16px;
      color: white;
      padding: 14px 18px;
      background: rgba(0, 0, 0, .65);
      border-radius: 10px;
      line-height: 1.6;
      pointer-events: none;
    }

    #help strong {
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="help">
    <strong>Flying Shapes Playground</strong><br />
    Click anywhere to lock the mouse and look around.<br />
    WASD = fly around · Mouse = look · Space / Shift = up / down<br />
    Hold Ctrl = fly faster · Esc = release mouse<br />
    Reload = new random shapes
  </div>

  <!-- Import Three.js as an ES module; no installation or build step needed. -->
  <script src="./spaceship-generator.js"></script>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    // ============================================================
    // 1. BASIC SCENE SETUP
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x10141b);

    const camera = new THREE.PerspectiveCamera(
      75,                                    // Field of view
      window.innerWidth / window.innerHeight,
      0.1,                                   // Near clipping distance
      1000                                   // Far clipping distance
    );
    camera.position.set(0, 3, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Lighting makes the 3D shapes easier to see.
    scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 2));
    const sunlight = new THREE.DirectionalLight(0xffffff, 2.5);
    sunlight.position.set(8, 15, 10);
    scene.add(sunlight);

    // Helpful visual reference: the X, Y, and Z axes.
    scene.add(new THREE.AxesHelper(3));

    // Shared spaceship recipe: segmented spine, gray rings, and red disks.
    const grayMaterial = new THREE.MeshStandardMaterial({
      color: 0x888888, metalness: 0.2, roughness: 0.55, side: THREE.DoubleSide
    });
    const redMaterial = new THREE.MeshStandardMaterial({
      color: 0xe53935, metalness: 0.1, roughness: 0.55, side: THREE.DoubleSide
    });
    const ship = SpaceshipGenerator.createObject(THREE, SpaceshipGenerator.generate(), {
      gray: grayMaterial, red: redMaterial
    });
    ship.position.set(0, 3, 0);
    scene.add(ship);

    // ============================================================
    // 5. MOUSE LOOK + FLYING WASD CONTROLS
    // ============================================================
    const keysDown = {};
    const moveSpeed = 7;              // Change this to fly faster/slower
    const mouseSensitivity = 0.002;   // Change this to adjust mouse look

    let yaw = 0;    // Left/right looking angle, in radians
    let pitch = 0;  // Up/down looking angle, in radians

    renderer.domElement.addEventListener('click', () => {
      renderer.domElement.requestPointerLock();
    });

    document.addEventListener('mousemove', (event) => {
      if (document.pointerLockElement !== renderer.domElement) return;

      yaw -= event.movementX * mouseSensitivity;
      pitch -= event.movementY * mouseSensitivity;

      // Prevent looking past straight up/down.
      pitch = THREE.MathUtils.clamp(pitch, -Math.PI / 2 + 0.01, Math.PI / 2 - 0.01);
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
    });

    document.addEventListener('keydown', (event) => {
      keysDown[event.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown'].includes(event.code)) event.preventDefault();
    });
    document.addEventListener('keyup', (event) => {
      keysDown[event.code] = false;
    });
    window.addEventListener('blur', () => {
      for (const key in keysDown) keysDown[key] = false;
    });

    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const movement = new THREE.Vector3();
    const clock = new THREE.Clock();

    function updateFlying(deltaSeconds) {
      // Forward follows the direction the camera is looking (including up/down).
      camera.getWorldDirection(forward);

      // Right points perpendicular to the forward direction, relative to world up.
      right.crossVectors(forward, camera.up).normalize();

      movement.set(0, 0, 0);
      if (keysDown.KeyW) movement.add(forward);
      if (keysDown.KeyS) movement.sub(forward);
      if (keysDown.KeyD) movement.add(right);
      if (keysDown.KeyA) movement.sub(right);
      if (keysDown.Space) movement.y += 1;
      if (keysDown.ShiftLeft || keysDown.ShiftRight) movement.y -= 1;

      // Normalize so diagonal movement isn't faster.
      if (movement.lengthSq() > 0) movement.normalize();
      const speed = moveSpeed * ((keysDown.ControlLeft || keysDown.ControlRight) ? 3 : 1);
      camera.position.addScaledVector(movement, speed * deltaSeconds);
    }

    // ============================================================
    // 6. RENDER LOOP + WINDOW RESIZING
    // ============================================================
    function animate() {
      requestAnimationFrame(animate);
      updateFlying(Math.min(clock.getDelta(), 0.05));
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
