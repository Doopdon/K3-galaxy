<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sci-Fi Room — Three.js</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040a;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      max-width: 350px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      background: rgba(4, 8, 18, 0.76);
      backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.45;
      user-select: none;
      pointer-events: none;
    }

    #hud strong {
      color: white;
    }

    #hud .small {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.64);
      font-size: 0.88rem;
    }

    #status {
      margin-top: 7px;
      color: #9fe7d7;
      font-size: 0.88rem;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 9;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      opacity: 0.55;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }

    #crosshair::before {
      left: 5px;
      top: 0;
      width: 2px;
      height: 12px;
    }

    #crosshair::after {
      left: 0;
      top: 5px;
      width: 12px;
      height: 2px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <strong>Sci-Fi Room</strong><br />
    Click to capture mouse<br />
    WASD: move &nbsp; Mouse: look<br />
    R: reset &nbsp; H: hide instructions
    <div class="small">
      The interior and exterior are separate groups, making the window view easy to replace with another scene or camera layer.
    </div>
    <div id="status">Click anywhere to begin.</div>
  </div>

  <div id="crosshair" aria-hidden="true"></div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    // -------------------------------------------------------------------------
    // Basic renderer, scene, and camera
    // -------------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x01030a);
    scene.fog = new THREE.FogExp2(0x01030a, 0.0035);

    const camera = new THREE.PerspectiveCamera(
      72,
      window.innerWidth / window.innerHeight,
      0.05,
      4000
    );

    camera.position.set(0, 1.7, 3.8);

    // Keep these separate. Later, outsideGroup can become a different scene.
    const roomGroup = new THREE.Group();
    const outsideGroup = new THREE.Group();
    scene.add(outsideGroup);
    scene.add(roomGroup);

    // -------------------------------------------------------------------------
    // Helpers
    // -------------------------------------------------------------------------
    const loader = new THREE.TextureLoader();

    function makeCanvasTexture(draw, width = 512, height = 512) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      draw(context, width, height);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function addBox({
      parent = roomGroup,
      size,
      position,
      material,
      rotation = [0, 0, 0],
      castShadow = true,
      receiveShadow = true
    }) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material
      );

      mesh.position.set(position[0], position[1], position[2]);
      mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder({
      parent = roomGroup,
      radiusTop,
      radiusBottom,
      height,
      position,
      material,
      radialSegments = 24,
      rotation = [0, 0, 0]
    }) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          radialSegments
        ),
        material
      );

      mesh.position.set(position[0], position[1], position[2]);
      mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------
    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x39414b,
      roughness: 0.72,
      metalness: 0.34
    });

    const darkMetalMaterial = new THREE.MeshStandardMaterial({
      color: 0x111821,
      roughness: 0.42,
      metalness: 0.82
    });

    const trimMaterial = new THREE.MeshStandardMaterial({
      color: 0x707d87,
      roughness: 0.32,
      metalness: 0.88
    });

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x202933,
      roughness: 0.68,
      metalness: 0.42
    });

    const clothMaterial = new THREE.MeshStandardMaterial({
      color: 0x536b71,
      roughness: 0.96,
      metalness: 0
    });

    const warmMaterial = new THREE.MeshStandardMaterial({
      color: 0x8a6b50,
      roughness: 0.78,
      metalness: 0.12
    });

    const glowingBlueMaterial = new THREE.MeshStandardMaterial({
      color: 0x79d9e9,
      emissive: 0x247b96,
      emissiveIntensity: 3.4,
      roughness: 0.2,
      metalness: 0.22
    });

    const glowingAmberMaterial = new THREE.MeshStandardMaterial({
      color: 0xffc77b,
      emissive: 0xb25b1d,
      emissiveIntensity: 2.8,
      roughness: 0.25,
      metalness: 0.18
    });

    // -------------------------------------------------------------------------
    // Room shell
    //
    // Interior size: approximately 10m wide, 12m deep, 4m tall.
    // The forward wall is at z = -6, with a large window opening.
    // -------------------------------------------------------------------------
    addBox({
      size: [10, 0.25, 12],
      position: [0, -0.125, 0],
      material: floorMaterial,
      castShadow: false
    });

    addBox({
      size: [10, 0.22, 12],
      position: [0, 4.05, 0],
      material: darkMetalMaterial,
      castShadow: false
    });

    addBox({
      size: [0.25, 4, 12],
      position: [-5.0, 2, 0],
      material: wallMaterial
    });

    addBox({
      size: [0.25, 4, 12],
      position: [5.0, 2, 0],
      material: wallMaterial
    });

    addBox({
      size: [10, 4, 0.25],
      position: [0, 2, 6.0],
      material: wallMaterial
    });

    // Front wall built around a window opening.
    addBox({
      size: [2.05, 4, 0.28],
      position: [-3.98, 2, -6.0],
      material: wallMaterial
    });

    addBox({
      size: [2.05, 4, 0.28],
      position: [3.98, 2, -6.0],
      material: wallMaterial
    });

    addBox({
      size: [5.9, 0.85, 0.28],
      position: [0, 0.425, -6.0],
      material: wallMaterial
    });

    addBox({
      size: [5.9, 0.72, 0.28],
      position: [0, 3.64, -6.0],
      material: wallMaterial
    });

    // Window frame.
    addBox({
      size: [6.25, 0.15, 0.45],
      position: [0, 3.27, -5.92],
      material: trimMaterial
    });

    addBox({
      size: [6.25, 0.15, 0.45],
      position: [0, 0.84, -5.92],
      material: trimMaterial
    });

    addBox({
      size: [0.15, 2.55, 0.45],
      position: [-3.05, 2.05, -5.92],
      material: trimMaterial
    });

    addBox({
      size: [0.15, 2.55, 0.45],
      position: [3.05, 2.05, -5.92],
      material: trimMaterial
    });

    // Slightly reflective glass.
    const glass = new THREE.Mesh(
      new THREE.PlaneGeometry(5.95, 2.28),
      new THREE.MeshPhysicalMaterial({
        color: 0x8ab5c5,
        transparent: true,
        opacity: 0.12,
        roughness: 0.08,
        metalness: 0.05,
        transmission: 0.25,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );

    glass.position.set(0, 2.04, -6.07);
    roomGroup.add(glass);

    // Window sill / bench.
    addBox({
      size: [6.4, 0.32, 0.85],
      position: [0, 0.7, -5.68],
      material: darkMetalMaterial
    });

    addBox({
      size: [5.7, 0.12, 0.62],
      position: [0, 0.92, -5.56],
      material: clothMaterial
    });

    // Structural ribs on the walls and ceiling.
    for (const z of [-4, -1.5, 1, 3.5]) {
      addBox({
        size: [0.16, 4, 0.3],
        position: [-4.83, 2, z],
        material: trimMaterial
      });

      addBox({
        size: [0.16, 4, 0.3],
        position: [4.83, 2, z],
        material: trimMaterial
      });
    }

    for (const x of [-3.8, -1.3, 1.3, 3.8]) {
      addBox({
        size: [0.12, 0.18, 11.2],
        position: [x, 3.88, 0],
        material: trimMaterial,
        castShadow: false
      });
    }

    // Floor strips.
    for (let x = -4; x <= 4; x += 1) {
      addBox({
        size: [0.025, 0.012, 11.3],
        position: [x, 0.012, 0],
        material: trimMaterial,
        castShadow: false
      });
    }

    // -------------------------------------------------------------------------
    // Furniture: bed, desk, chair, storage, plant
    // -------------------------------------------------------------------------
    // Bed.
    addBox({
      size: [2.8, 0.45, 4.3],
      position: [-3.15, 0.45, 2.7],
      material: darkMetalMaterial
    });

    addBox({
      size: [2.55, 0.34, 3.75],
      position: [-3.15, 0.81, 2.55],
      material: clothMaterial
    });

    addBox({
      size: [2.45, 0.25, 1.0],
      position: [-3.15, 1.05, 4.0],
      material: new THREE.MeshStandardMaterial({
        color: 0xa8b9b2,
        roughness: 0.98
      })
    });

    addBox({
      size: [2.65, 1.65, 0.22],
      position: [-3.15, 1.2, 4.9],
      material: darkMetalMaterial
    });

    // Desk.
    addBox({
      size: [3.5, 0.18, 1.35],
      position: [2.7, 1.05, 2.35],
      material: warmMaterial
    });

    for (const x of [1.25, 4.15]) {
      for (const z of [1.88, 2.82]) {
        addBox({
          size: [0.14, 1.05, 0.14],
          position: [x, 0.53, z],
          material: darkMetalMaterial
        });
      }
    }

    // Monitor housing.
    addBox({
      size: [1.95, 1.18, 0.16],
      position: [2.75, 1.85, 2.72],
      material: darkMetalMaterial,
      rotation: [0, 0, 0]
    });

    const monitorTexture = makeCanvasTexture((ctx, width, height) => {
      ctx.fillStyle = "#07121d";
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = "#64d7ea";
      ctx.lineWidth = 7;
      ctx.strokeRect(22, 22, width - 44, height - 44);

      ctx.fillStyle = "#64d7ea";
      ctx.font = "bold 30px monospace";
      ctx.fillText("CITY SYSTEMS", 48, 78);

      ctx.font = "22px monospace";
      ctx.fillStyle = "#9ce9f5";
      ctx.fillText("Transit spine: nominal", 48, 135);
      ctx.fillText("Hull drift: 0.0007%", 48, 180);
      ctx.fillText("Window shield: clear", 48, 225);

      ctx.strokeStyle = "#2f8495";
      ctx.lineWidth = 4;
      ctx.beginPath();

      for (let x = 45; x < width - 45; x += 12) {
        const y = 330 + Math.sin(x * 0.045) * 42 + Math.sin(x * 0.11) * 15;

        if (x === 45) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();
    });

    const monitorScreen = new THREE.Mesh(
      new THREE.PlaneGeometry(1.74, 0.96),
      new THREE.MeshStandardMaterial({
        map: monitorTexture,
        emissiveMap: monitorTexture,
        emissive: 0xffffff,
        emissiveIntensity: 1.15,
        roughness: 0.3
      })
    );

    monitorScreen.position.set(2.75, 1.86, 2.625);
    monitorScreen.rotation.y = Math.PI;
    roomGroup.add(monitorScreen);

    addBox({
      size: [0.18, 0.7, 0.18],
      position: [2.75, 1.35, 2.78],
      material: darkMetalMaterial
    });

    // Chair.
    addBox({
      size: [1.0, 0.18, 1.0],
      position: [2.7, 0.62, 0.95],
      material: clothMaterial
    });

    addBox({
      size: [1.0, 1.25, 0.18],
      position: [2.7, 1.18, 1.4],
      material: clothMaterial,
      rotation: [-0.12, 0, 0]
    });

    addCylinder({
      radiusTop: 0.12,
      radiusBottom: 0.16,
      height: 0.62,
      position: [2.7, 0.31, 0.95],
      material: darkMetalMaterial
    });

    // Storage cabinets.
    for (let y = 0.55; y <= 2.75; y += 1.1) {
      addBox({
        size: [1.65, 0.92, 0.75],
        position: [4.22, y, 4.85],
        material: darkMetalMaterial
      });

      addBox({
        size: [1.25, 0.05, 0.08],
        position: [4.22, y, 4.44],
        material: glowingBlueMaterial,
        castShadow: false
      });
    }

    // Small plant.
    addCylinder({
      radiusTop: 0.42,
      radiusBottom: 0.34,
      height: 0.58,
      position: [-4.1, 0.29, -4.9],
      material: warmMaterial
    });

    const leafMaterial = new THREE.MeshStandardMaterial({
      color: 0x4d8060,
      roughness: 0.9,
      side: THREE.DoubleSide
    });

    for (let i = 0; i < 12; i++) {
      const leaf = new THREE.Mesh(
        new THREE.SphereGeometry(0.19, 10, 6),
        leafMaterial
      );

      const angle = (i / 12) * Math.PI * 2;
      const radius = 0.25 + (i % 3) * 0.08;

      leaf.position.set(
        -4.1 + Math.cos(angle) * radius,
        0.64 + (i % 4) * 0.15,
        -4.9 + Math.sin(angle) * radius
      );

      leaf.scale.set(0.6, 1.7, 0.7);
      leaf.rotation.z = Math.cos(angle) * 0.75;
      leaf.rotation.x = Math.sin(angle) * 0.75;
      leaf.castShadow = true;
      roomGroup.add(leaf);
    }

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------
    const ambient = new THREE.HemisphereLight(0x8fcfe4, 0x121318, 0.75);
    roomGroup.add(ambient);

    const windowLight = new THREE.RectAreaLight(0x8bcdf5, 5.5, 5.8, 2.3);
    windowLight.position.set(0, 2.1, -5.4);
    windowLight.lookAt(0, 1.5, 0);
    roomGroup.add(windowLight);

    const warmLight = new THREE.PointLight(0xffbd77, 20, 9, 1.8);
    warmLight.position.set(-2.8, 2.6, 3.8);
    warmLight.castShadow = true;
    warmLight.shadow.mapSize.set(1024, 1024);
    roomGroup.add(warmLight);

    const deskLight = new THREE.PointLight(0x66dfff, 9, 5, 2);
    deskLight.position.set(2.7, 2.3, 2.1);
    roomGroup.add(deskLight);

    // Ceiling lights.
    for (const z of [-3.5, 0, 3.5]) {
      addBox({
        size: [2.6, 0.06, 0.18],
        position: [0, 3.9, z],
        material: z === 3.5 ? glowingAmberMaterial : glowingBlueMaterial,
        castShadow: false
      });
    }

    // -------------------------------------------------------------------------
    // Exterior: stars, distant city lights, and giant structural rings
    // -------------------------------------------------------------------------
    outsideGroup.position.z = -7;

    // Star field.
    const starCount = 6500;
    const starPositions = new Float32Array(starCount * 3);
    let seed = 0x8f1343ac;

    function random() {
      seed ^= seed << 13;
      seed ^= seed >>> 17;
      seed ^= seed << 5;
      return (seed >>> 0) / 4294967296;
    }

    for (let i = 0; i < starCount; i++) {
      const radius = 250 + random() * 1500;
      const theta = random() * Math.PI * 2;
      const phi = Math.acos(2 * random() - 1);

      starPositions[i * 3] = Math.sin(phi) * Math.cos(theta) * radius;
      starPositions[i * 3 + 1] = Math.cos(phi) * radius;
      starPositions[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * radius - 200;
    }

    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(starPositions, 3)
    );

    const stars = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({
        color: 0xd9ebff,
        size: 1.35,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.9
      })
    );

    outsideGroup.add(stars);

    // Huge curved rings suggest the room is embedded in an enormous structure.
    const ringMaterial = new THREE.MeshBasicMaterial({
      color: 0x263c58,
      transparent: true,
      opacity: 0.8,
      side: THREE.DoubleSide
    });

    for (let i = 0; i < 7; i++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(
          70 + i * 18,
          1.8 + i * 0.15,
          10,
          160,
          Math.PI * 1.5
        ),
        ringMaterial
      );

      ring.position.set(
        -25 + i * 8,
        5 + i * 2.3,
        -135 - i * 36
      );

      ring.rotation.set(
        Math.PI * 0.48,
        0.08 + i * 0.025,
        Math.PI * 0.12
      );

      outsideGroup.add(ring);
    }

    // Distant structural spine.
    const spineMaterial = new THREE.MeshBasicMaterial({
      color: 0x182b40
    });

    for (let i = 0; i < 55; i++) {
      const tower = new THREE.Mesh(
        new THREE.BoxGeometry(
          5 + random() * 10,
          18 + random() * 65,
          4 + random() * 10
        ),
        spineMaterial
      );

      tower.position.set(
        -160 + i * 6.5,
        -12 + random() * 12,
        -205 - random() * 55
      );

      tower.rotation.z = (random() - 0.5) * 0.12;
      outsideGroup.add(tower);

      const lightRows = 2 + Math.floor(random() * 5);

      for (let j = 0; j < lightRows; j++) {
        const light = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.35, 0.2),
          new THREE.MeshBasicMaterial({
            color: random() > 0.28 ? 0x77d7ea : 0xffb35e
          })
        );

        light.position.set(
          tower.position.x + (random() - 0.5) * 4,
          tower.position.y + (random() - 0.5) * 25,
          tower.position.z + 5
        );

        outsideGroup.add(light);
      }
    }

    // A dim blue planet or habitat body.
    const planet = new THREE.Mesh(
      new THREE.SphereGeometry(28, 48, 28),
      new THREE.MeshStandardMaterial({
        color: 0x274e65,
        roughness: 0.92,
        emissive: 0x081c2c,
        emissiveIntensity: 0.8
      })
    );

    planet.position.set(92, 24, -280);
    outsideGroup.add(planet);

    const planetLight = new THREE.DirectionalLight(0x9bcfff, 2.2);
    planetLight.position.set(-80, 120, 100);
    outsideGroup.add(planetLight);

    // -------------------------------------------------------------------------
    // First-person controls
    // -------------------------------------------------------------------------
    const keys = new Set();
    const velocity = new THREE.Vector3();
    const wishDirection = new THREE.Vector3();
    const euler = new THREE.Euler(0, 0, 0, "YXZ");
    const clock = new THREE.Clock();

    const status = document.getElementById("status");
    const hud = document.getElementById("hud");

    const moveSpeed = 3.2;
    const acceleration = 12;
    const damping = 10;
    const mouseSensitivity = 0.0022;

    // Room movement limits. These keep the player inside the room.
    const roomBounds = {
      minX: -4.55,
      maxX: 4.55,
      minZ: -5.15,
      maxZ: 5.45
    };

    function resetPlayer() {
      camera.position.set(0, 1.7, 3.8);
      velocity.set(0, 0, 0);
      euler.set(0, 0, 0);
      camera.quaternion.setFromEuler(euler);
    }

    function updatePlayer(deltaTime) {
      wishDirection.set(0, 0, 0);

      if (keys.has("KeyW")) wishDirection.z -= 1;
      if (keys.has("KeyS")) wishDirection.z += 1;
      if (keys.has("KeyA")) wishDirection.x -= 1;
      if (keys.has("KeyD")) wishDirection.x += 1;

      if (wishDirection.lengthSq() > 0) {
        wishDirection.normalize();

        // Only yaw affects walking, so looking up does not make the player fly.
        const yawQuaternion = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(0, 1, 0),
          euler.y
        );

        wishDirection.applyQuaternion(yawQuaternion);

        velocity.lerp(
          wishDirection.multiplyScalar(moveSpeed),
          1 - Math.exp(-acceleration * deltaTime)
        );
      } else {
        velocity.multiplyScalar(Math.exp(-damping * deltaTime));
      }

      camera.position.addScaledVector(velocity, deltaTime);
      camera.position.x = THREE.MathUtils.clamp(
        camera.position.x,
        roomBounds.minX,
        roomBounds.maxX
      );
      camera.position.z = THREE.MathUtils.clamp(
        camera.position.z,
        roomBounds.minZ,
        roomBounds.maxZ
      );
      camera.position.y = 1.7;
    }

    renderer.domElement.addEventListener("click", () => {
      renderer.domElement.requestPointerLock();
    });

    document.addEventListener("pointerlockchange", () => {
      const captured = document.pointerLockElement === renderer.domElement;
      status.textContent = captured
        ? "Mouse captured. Press Esc to release."
        : "Click anywhere to resume.";
    });

    document.addEventListener("mousemove", (event) => {
      if (document.pointerLockElement !== renderer.domElement) return;

      euler.y -= event.movementX * mouseSensitivity;
      euler.x -= event.movementY * mouseSensitivity;
      euler.x = THREE.MathUtils.clamp(
        euler.x,
        -Math.PI / 2 + 0.02,
        Math.PI / 2 - 0.02
      );

      camera.quaternion.setFromEuler(euler);
    });

    window.addEventListener("keydown", (event) => {
      keys.add(event.code);

      if (event.code === "KeyR") {
        resetPlayer();
      }

      if (event.code === "KeyH") {
        hud.style.display = hud.style.display === "none" ? "block" : "none";
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    window.addEventListener("blur", () => {
      keys.clear();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // -------------------------------------------------------------------------
    // Animation
    // -------------------------------------------------------------------------
    function animate() {
      const deltaTime = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      updatePlayer(deltaTime);

      // Barely perceptible exterior movement gives the view some life.
      outsideGroup.rotation.y = Math.sin(elapsed * 0.025) * 0.0025;
      planet.rotation.y += deltaTime * 0.012;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    resetPlayer();
    animate();
  </script>
</body>
</html>
