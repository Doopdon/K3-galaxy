<!DOCTYPE html>
<html>

<head>
    <title>Red Ball</title>
</head>

<body style="margin: 0; overflow: hidden;">

    <script type="module">

        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js";

        // Sphere Scene
        const sphereSceneData = {
            scene: new THREE.Scene(),
            camera: new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000),
            scale: .1,
            populateScene: function (position) {
                for (let i = 0; i < 10; i++) {
                    const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);
                    const sphereMaterial = new THREE.MeshBasicMaterial({
                        color: "red"
                    });
                    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);

                    sphere.position.set(
                        position.x + Math.random() * 20 - 10,
                        position.y + Math.random() * 20 - 10,
                        position.z + Math.random() * 20 - 10
                    );

                    this.scene.add(sphere);
                }
            }
        }
        sphereSceneData.camera.rotation.order = "YXZ";
        sphereSceneData.camera.position.z = 5;

        const greenSphereSceneData = {
            scene: new THREE.Scene(),
            camera: new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000),
            scale: .01,
            populateScene: function (position) {
                for (let i = 0; i < 10; i++) {
                    const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);
                    const sphereMaterial = new THREE.MeshBasicMaterial({
                        color: "green"
                    });
                    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);

                    sphere.position.set(
                        position.x + Math.random() * 20 - 10,
                        position.y + Math.random() * 20 - 10,
                        position.z + Math.random() * 20 - 10
                    );

                    this.scene.add(sphere);
                }
            }
        }
        greenSphereSceneData.camera.rotation.order = "YXZ";
        greenSphereSceneData.camera.position.z = 5;


        // Cube
        const cubeSceneData = {
            scene: new THREE.Scene(),
            camera: new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000),
            scale: 1,
            populateScene: function () {
                for (let i = 0; i < 100; i++) {
                    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
                    const cubeMaterial = new THREE.MeshBasicMaterial({
                        color: "blue"
                    });
                    const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);

                    cube.position.set(
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10
                    );

                    cube.userData.visited = false;

                    this.scene.add(cube);
                }
            },
            checkCollision: function () {
                const cameraPosition = this.camera.position;
                for (const cube of this.scene.children) {
                    if (cube.userData.visited) continue;

                    const distance = cameraPosition.distanceTo(cube.position);
                    if (distance < 1) {
                        sphereSceneData.scene.clear();
                        for (const otherCube of this.scene.children) {
                            otherCube.userData.visited = false;
                            otherCube.visible = true;
                        }
                        cube.userData.visited = true;
                        cube.visible = false;

                        sphereSceneData.populateScene(cube.position.clone().multiplyScalar(1/sphereSceneData.scale));

                        console.log("Entered cube!", cube.position);
                    }
                }
            }
        }
        cubeSceneData.camera.rotation.order = "YXZ";
        cubeSceneData.camera.position.z = 5;





        const scenesData = [
            cubeSceneData,
            sphereSceneData
        ];


        // Renderer
        const renderer = new THREE.WebGLRenderer();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.autoClear = false;

        document.body.appendChild(renderer.domElement);



        let keys = {};
        function addEventHandlers() {
            let mainCamera = scenesData[0].camera;
            addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
            addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

            renderer.domElement.addEventListener("click", () => renderer.domElement.requestPointerLock());

            addEventListener("mousemove", e => {
                if (document.pointerLockElement !== renderer.domElement) return;

                mainCamera.rotation.y -= e.movementX * 0.002;
                mainCamera.rotation.x -= e.movementY * 0.002;

                mainCamera.rotation.x = Math.max(
                    -Math.PI / 2,
                    Math.min(Math.PI / 2, mainCamera.rotation.x)
                );
            });


        }

        function moveCamera() {
            let mainCamera = scenesData[0].camera;
            if (keys["w"]) mainCamera.translateZ(-0.1);
            if (keys["s"]) mainCamera.translateZ(0.1);
            if (keys["a"]) mainCamera.translateX(-0.1);
            if (keys["d"]) mainCamera.translateX(0.1);

            if (keys["arrowup"]) mainCamera.rotation.x += 0.01;
            if (keys["arrowdown"]) mainCamera.rotation.x -= 0.01;
            if (keys["arrowleft"]) mainCamera.rotation.y += 0.01;
            if (keys["arrowright"]) mainCamera.rotation.y -= 0.01;

            mainCamera.rotation.x = Math.max(
                -Math.PI / 2,
                Math.min(Math.PI / 2, mainCamera.rotation.x)
            );
        }

        scenesData[0].populateScene();

        addEventHandlers();

        function run() {
            setTimeout(() => {
                moveCamera();

                renderer.clear();
                scenesData.forEach((data, i) => {
                    if (i !== 0) {
                        data.camera.rotation.copy(scenesData[0].camera.rotation);
                        data.camera.position.copy(scenesData[0].camera.position).multiplyScalar(1/data.scale);
                        renderer.clearDepth();
                    }
                    data.checkCollision?.();
                    renderer.render(data.scene, data.camera);
                });
                run();
            }, 10);
        }
        run();


    </script>

</body>

</html>
