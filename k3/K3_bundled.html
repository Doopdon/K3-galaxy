function captureSkybox(
    renderer,
    scene,
    position,
    resolution = 128
) {
    const target =
        new THREE.WebGLCubeRenderTarget(
            resolution,
            {
                type: THREE.HalfFloatType,

                generateMipmaps: true,

                minFilter:
                    THREE.LinearMipmapLinearFilter
            }
        );

    const cubeCamera =
        new THREE.CubeCamera(
            0.1,
            10000,
            target
        );

    cubeCamera.position.copy(position);

    scene.add(cubeCamera);

    cubeCamera.update(
        renderer,
        scene
    );

    scene.remove(cubeCamera);


    // Keep the render target alive along with the texture.
    target.texture.userData.renderTarget =
        target;

    return target.texture;
}

class SpatialHashGrid {

    constructor(cellSize) {
        this.cellSize = cellSize;
        this.cells = new Map();
    }

    getKey(position) {

        const x = Math.floor(position.x / this.cellSize);
        const y = Math.floor(position.y / this.cellSize);
        const z = Math.floor(position.z / this.cellSize);

        return `${x},${y},${z}`;
    }

    add(object, position) {

        const key = this.getKey(position);

        if (!this.cells.has(key)) {
            this.cells.set(key, []);
        }

        this.cells.get(key).push(object);
    }

    getNearby(position) {

        const cx = Math.floor(position.x / this.cellSize);
        const cy = Math.floor(position.y / this.cellSize);
        const cz = Math.floor(position.z / this.cellSize);

        const results = [];

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {

                    const key =
                        `${cx + x},${cy + y},${cz + z}`;

                    const cell =
                        this.cells.get(key);

                    if (cell) {
                        results.push(...cell);
                    }
                }
            }
        }

        return results;
    }
}

class SceneData {

    constructor({
        scale,
        timescale = 1,
        disapearDistance = 1,
        childScenes = [],
        collisionEnterDistance = 0.01,
        getSubSceneData,
        populateScene,
        animate
    }) {

        this.scene = new THREE.Scene();

        this.camera = new THREE.PerspectiveCamera(
            70,
            window.innerWidth / window.innerHeight,
            0.005,
            7000
        );

        this.camera.rotation.order = "YXZ";
        this.camera.position.z = 5;


        // Scene properties
        this.scale = scale;
        this.timescale = timescale;
        this.speedMultiplier = 1;

        this.disapearDistance = disapearDistance;
        this.childScenes = childScenes;


        // Only these objects can be entered
        this.colliders = [];


        // Current thing we're riding
        this.activeCollider = null;
        this.activeSubScene = null;

        this.parentCollider = null;
        this.parentSceneData = null;


        // Previous transform of collider
        this.lastColliderPosition = new THREE.Vector3();
        this.lastColliderQuaternion = new THREE.Quaternion();


        // User supplied behavior
        this.populateSceneFunction = populateScene;
        this.animateFunction = animate;

        if (getSubSceneData) {
            this.getSubSceneData = getSubSceneData;
        }

        this.rootGroup = new THREE.Group();
        this.scene.add(this.rootGroup);
    }

    addCollider(object) {

        this.colliders.push(object);

        return object;
    }

    updateParentLock() {

        if (!this.parentCollider) return;

        const position = new THREE.Vector3();
        const quaternion = new THREE.Quaternion();

        this.parentCollider.getWorldPosition(position);
        this.parentCollider.getWorldQuaternion(quaternion);

        position.multiplyScalar(
            this.parentSceneData.scale / this.scale
        );

        this.rootGroup.position.copy(position);
        this.rootGroup.quaternion.copy(quaternion);
    }

    getColliderLocalQuaternion(collider) {

        const colliderWorld = new THREE.Quaternion();
        const rootWorld = new THREE.Quaternion();

        collider.getWorldQuaternion(colliderWorld);
        this.rootGroup.getWorldQuaternion(rootWorld);

        return rootWorld
            .invert()
            .multiply(colliderWorld);
    }

    populateScene() {

        this.colliders = [];

        // Clear old child content
        this.rootGroup.clear();

        // Rebuild the scene contents locally around rootGroup
        this.populateSceneFunction?.call(this);
    }

    update(deltaTime) {

        this.updateParentLock();

        const scaledDelta =
            deltaTime * this.speedMultiplier;

        this.animateFunction?.call(
            this,
            scaledDelta
        );

        this.scene.updateMatrixWorld(true);

        this.updateCameraLock();
    }

    getColliders() {
        return this.colliders;
    }

    getColliderDistance(collider) {

        const cameraWorld =
            new THREE.Vector3();

        this.camera.getWorldPosition(
            cameraWorld
        );


        // --------------------------------
        // POINT COLLIDER
        // --------------------------------

        if (
            collider.userData
                ?.collisionType === "point"
        ) {

            const colliderWorld =
                new THREE.Vector3();

            collider.getWorldPosition(
                colliderWorld
            );


            return cameraWorld.distanceTo(
                colliderWorld
            );
        }


        // --------------------------------
        // NO GEOMETRY FALLBACK
        // --------------------------------

        if (!collider.geometry) {

            const colliderWorld =
                new THREE.Vector3();

            collider.getWorldPosition(
                colliderWorld
            );


            return cameraWorld.distanceTo(
                colliderWorld
            );
        }


        // --------------------------------
        // GEOMETRY COLLIDER
        // --------------------------------

        if (
            !collider.geometry.boundingBox
        ) {

            collider.geometry
                .computeBoundingBox();
        }


        // Camera in collider-local space.
        const cameraLocal =
            collider.worldToLocal(
                cameraWorld.clone()
            );


        // Closest point on the box.
        const closestLocal =
            cameraLocal.clone()
                .clamp(
                    collider.geometry
                        .boundingBox.min,

                    collider.geometry
                        .boundingBox.max
                );


        // Convert closest point back to world.
        const closestWorld =
            collider.localToWorld(
                closestLocal
            );


        return cameraWorld.distanceTo(
            closestWorld
        );
    }

    isCameraInsideCollider(collider) {

        if (!collider.geometry) {
            return false;
        }


        if (
            !collider.geometry.boundingBox
        ) {

            collider.geometry
                .computeBoundingBox();
        }


        const cameraWorld =
            new THREE.Vector3();

        this.camera.getWorldPosition(
            cameraWorld
        );


        // Transform the camera into the
        // collider's local coordinate system.
        const cameraLocal =
            collider.worldToLocal(
                cameraWorld.clone()
            );


        return collider.geometry
            .boundingBox
            .containsPoint(
                cameraLocal
            );
    }

    checkCollision() {

        this.scene.updateMatrixWorld(true);


        // --------------------------------
        // ALREADY INSIDE SOMETHING
        // --------------------------------

        if (this.activeCollider) {

            const distance =
                this.getColliderDistance(
                    this.activeCollider
                );


            if (
                distance >
                this.disapearDistance
            ) {

                this.leaveCollider();
            }

            return;
        }


        // --------------------------------
        // LOOK FOR COLLIDERS
        // --------------------------------

        const cameraWorld =
            new THREE.Vector3();

        this.camera.getWorldPosition(
            cameraWorld
        );


        let bestCollider =
            null;

        let bestCenterDistance =
            Infinity;


        for (
            const collider
            of this.getColliders()
        ) {

            const isPoint =
                collider.userData
                    ?.collisionType === "point";


            let collided;


            // Point objects:
            // stars, mirrors, pyramids, etc.
            if (isPoint) {

                collided =
                    this.getColliderDistance(
                        collider
                    ) <
                    this.disapearDistance;
            }


            // Physical objects:
            // box colliders.
            else {

                collided =
                    this.isCameraInsideCollider(
                        collider
                    );
            }


            if (!collided) {
                continue;
            }


            // Multiple colliders may overlap.
            // Pick the nearest one.
            const center =
                new THREE.Vector3();

            collider.getWorldPosition(
                center
            );


            const centerDistance =
                cameraWorld.distanceTo(
                    center
                );


            if (
                centerDistance <
                bestCenterDistance
            ) {

                bestCollider =
                    collider;

                bestCenterDistance =
                    centerDistance;
            }
        }


        // --------------------------------
        // ENTER WINNER
        // --------------------------------

        if (bestCollider) {

            const position =
                new THREE.Vector3();

            bestCollider.getWorldPosition(
                position
            );


            this.enterCollider(
                bestCollider,
                position
            );
        }
    }

    enterCollider(collider, worldPosition) {
        // any extra functionality to call when enetering an object.
        this.onColide?.(collider, worldPosition)

        const subScene = this.getSubSceneData(collider);


        // Always lock to the collider
        this.activeCollider = collider;
        this.activeSubScene = subScene ?? null;


        // Remember its current transform for camera locking
        collider.getWorldPosition(
            this.lastColliderPosition
        );

        // Convert from world position into this scene's local frame
        this.rootGroup.worldToLocal(
            this.lastColliderPosition
        );

        this.lastColliderQuaternion.copy(
            this.getColliderLocalQuaternion(collider)
        );


        // No deeper scene:
        // stay locked to the object, but don't change the stack
        if (!subScene) {
            return;
        }


        // Tell the child scene what object/frame it belongs to
        subScene.parentCollider = collider;
        subScene.parentSceneData = this;


        // Hide parent object because we've descended inside it
        collider.visible = false;


        // Position child scene root at the collider
        subScene.updateParentLock();
        subScene.populateScene();

        // subScene.alignCameraUp();


        // Add child to active hierarchy
        const index =
            activeSceneStack.indexOf(this);

        activeSceneStack.splice(index + 1);

        activeSceneStack.push(subScene);




        updateTimeScales();
    }

    leaveCollider() {
        if (!this.activeCollider) return;


        this.activeSubScene?.remove();

        this.activeCollider.visible = true;

        this.activeCollider = null;
        this.activeSubScene = null;


        const index =
            activeSceneStack.indexOf(this);

        activeSceneStack.splice(index + 1);


        updateTimeScales();

        // this.alignCameraUp()
    }

    updateCameraLock() {

        if (!this.activeCollider) return;

        const mainCamera = scenesData[0].camera;


        // ----------------------
        // COLLIDER LOCAL POSITION
        // ----------------------

        const newPosition = new THREE.Vector3();

        this.activeCollider.getWorldPosition(
            newPosition
        );

        this.rootGroup.worldToLocal(
            newPosition
        );


        // ----------------------
        // COLLIDER LOCAL ROTATION
        // ----------------------

        const newQuaternion =
            this.getColliderLocalQuaternion(
                this.activeCollider
            );


        // ----------------------
        // TRANSLATION CHANGE
        // ----------------------

        const movement = newPosition
            .clone()
            .sub(this.lastColliderPosition);


        // Movement is currently in rootGroup coordinates.
        // Convert its direction back into world coordinates.

        const rootQuaternion =
            new THREE.Quaternion();

        this.rootGroup.getWorldQuaternion(
            rootQuaternion
        );

        movement.applyQuaternion(
            rootQuaternion
        );


        movement.multiplyScalar(
            this.scale / scenesData[0].scale
        );


        mainCamera.position.add(
            movement
        );


        // ----------------------
        // ROTATION CHANGE
        // ----------------------

        const rotationChange =
            newQuaternion
                .clone()
                .multiply(
                    this.lastColliderQuaternion
                        .clone()
                        .invert()
                );


        // rotationChange is local to rootGroup.
        // Convert it into world-space rotation.

        const rootInverse =
            rootQuaternion
                .clone()
                .invert();

        const worldRotationChange =
            rootQuaternion
                .clone()
                .multiply(rotationChange)
                .multiply(rootInverse);


        // ----------------------
        // ROTATE CAMERA POSITION
        // AROUND THE COLLIDER
        // ----------------------

        const colliderWorldPosition =
            new THREE.Vector3();

        this.activeCollider.getWorldPosition(
            colliderWorldPosition
        );

        colliderWorldPosition.multiplyScalar(
            this.scale / scenesData[0].scale
        );


        const cameraOffset =
            mainCamera.position
                .clone()
                .sub(colliderWorldPosition);


        cameraOffset.applyQuaternion(
            worldRotationChange
        );


        mainCamera.position
            .copy(colliderWorldPosition)
            .add(cameraOffset);


        // Rotate where camera is looking too
        mainCamera.quaternion.premultiply(
            worldRotationChange
        );


        // ----------------------
        // SAVE FOR NEXT FRAME
        // ----------------------

        this.lastColliderPosition.copy(
            newPosition
        );

        this.lastColliderQuaternion.copy(
            newQuaternion
        );
    }

    getSubSceneData(collider) {
        return this.childScenes[0];
    }

    remove() {

        this.activeSubScene?.remove();

        this.rootGroup.clear();

        this.colliders = [];

        this.activeCollider = null;
        this.activeSubScene = null;

        this.parentCollider = null;
        this.parentSceneData = null;
    }

}

class HabSceneData extends SceneData {

    constructor(options) {

        super(options);

        // In the room:
        //
        // +Z = radially outward / floor
        // -Z = radially inward / ceiling
        //
        // Therefore camera UP is -Z.
        this.upAxisLocal =
            new THREE.Vector3(0, 0, -1);
    }


    // --------------------------------
    // HAB UPDATE
    // --------------------------------

    update(deltaTime) {

        super.update(deltaTime);

        this.alignCameraToHabUp();
    }


    // --------------------------------
    // GET ROOM "UP" IN WORLD SPACE
    // --------------------------------

    getHabUpWorld() {

        const quaternion =
            new THREE.Quaternion();

        this.rootGroup.getWorldQuaternion(
            quaternion
        );


        return this.upAxisLocal
            .clone()
            .applyQuaternion(quaternion)
            .normalize();
    }


    // --------------------------------
    // KEEP CAMERA UPRIGHT IN HAB
    // --------------------------------

    alignCameraToHabUp() {

        const camera =
            scenesData[0].camera;

        const up =
            this.getHabUpWorld();


        // Current look direction.
        const forward =
            new THREE.Vector3(0, 0, -1)
                .applyQuaternion(
                    camera.quaternion
                )
                .normalize();


        // --------------------------------
        // CURRENT PITCH
        // --------------------------------

        let pitch =
            Math.asin(
                THREE.MathUtils.clamp(
                    forward.dot(up),
                    -1,
                    1
                )
            );


        const maxPitch =
            THREE.MathUtils.degToRad(89);


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -maxPitch,
                maxPitch
            );


        // --------------------------------
        // REMOVE VERTICAL COMPONENT
        // TO FIND HEADING
        // --------------------------------

        const horizontalForward =
            forward
                .clone()
                .addScaledVector(
                    up,
                    -forward.dot(up)
                );


        // If we're nearly looking straight
        // up/down, recover heading from
        // camera-right instead.
        if (
            horizontalForward.lengthSq() <
            0.000001
        ) {

            const right =
                new THREE.Vector3(1, 0, 0)
                    .applyQuaternion(
                        camera.quaternion
                    )
                    .normalize();


            horizontalForward
                .copy(up)
                .cross(right);
        }


        if (
            horizontalForward.lengthSq() <
            0.000001
        ) {
            return;
        }


        horizontalForward.normalize();


        // --------------------------------
        // REBUILD LOOK DIRECTION
        // --------------------------------

        const correctedForward =
            horizontalForward
                .multiplyScalar(
                    Math.cos(pitch)
                )
                .addScaledVector(
                    up,
                    Math.sin(pitch)
                )
                .normalize();


        // --------------------------------
        // FORCE CAMERA TOP TOWARD CEILING
        // --------------------------------

        camera.up.copy(up);


        camera.lookAt(
            camera.position
                .clone()
                .add(correctedForward)
        );
    }
}
class GalaxySceneData extends SceneData {
    constructor(options) {
        super(options);
    }
    buildCollisionGrid(
        collisionFrame,
        cellSize = this.disapearDistance * 2
    ) {

        this.collisionFrame = collisionFrame;

        this.collisionGrid =
            new SpatialHashGrid(cellSize);

        this.scene.updateMatrixWorld(true);

        for (const collider of this.colliders) {

            const position = new THREE.Vector3();

            collider.getWorldPosition(position);

            collisionFrame.worldToLocal(position);

            this.collisionGrid.add(
                collider,
                position
            );
        }
    }

    getColliders() {
        return this.getNearbyColliders();
    }

    getNearbyColliders() {

        // Small scene / no grid
        if (!this.collisionGrid) {
            return this.colliders;
        }

        const cameraPosition =
            this.camera.position.clone();

        // Camera and collisionFrame exist in same scene,
        // so convert camera to the grid's local coordinates.
        this.collisionFrame.worldToLocal(
            cameraPosition
        );

        return this.collisionGrid.getNearby(
            cameraPosition
        );
    }
}

const roomSceneData =
    new HabSceneData({

        scale: 0.000000001,

        timescale: 5,

        disapearDistance: 1.0,

        childScenes: [],


        populateScene: function () {

            // --------------------------------
            // ROOM SIZE
            // --------------------------------

            const width = 12;
            const height = 7;
            const depth = 16;

            const wallThickness = 0.15;


            // --------------------------------
            // FIND WHERE THE PLAYER ACTUALLY IS
            // IN THIS SCENE
            // --------------------------------

            this.scene.updateMatrixWorld(true);


            const mainCamera =
                scenesData[0].camera;


            // Same conversion your engine uses
            // when syncing child-scene cameras.
            const cameraInScene =
                mainCamera.position
                    .clone()
                    .multiplyScalar(
                        1 / this.scale
                    );


            // Convert into rootGroup-local space.
            const roomCenter =
                this.rootGroup.worldToLocal(
                    cameraInScene
                );


            // --------------------------------
            // PUT THE PLAYER NEAR THE FLOOR
            // --------------------------------
            //
            // +Z = floor / radial outward
            // -Z = ceiling / radial inward
            //
            // Put the floor about 1.6 units
            // below the camera.

            const standingHeight = 1.6;


            roomCenter.z -=
                height / 2 -
                standingHeight;



            // --------------------------------
            // MATERIALS
            // --------------------------------

            const wallMaterial =
                new THREE.MeshStandardMaterial({

                    color: 0xb8b1a5,

                    roughness: 0.8,

                    metalness: 0,

                    side:
                        THREE.DoubleSide
                });


            const floorMaterial =
                new THREE.MeshStandardMaterial({

                    color: 0x403b35,

                    roughness: 0.9,

                    side:
                        THREE.DoubleSide
                });


            // --------------------------------
            // HELPER
            // --------------------------------
            //
            // All coordinates are relative
            // to roomCenter now.

            const makeWall =
                (
                    sizeX,
                    sizeY,
                    sizeZ,

                    x,
                    y,
                    z,

                    material = wallMaterial
                ) => {

                    const wall =
                        new THREE.Mesh(

                            new THREE.BoxGeometry(
                                sizeX,
                                sizeY,
                                sizeZ
                            ),

                            material
                        );


                    wall.position.set(

                        roomCenter.x + x,

                        roomCenter.y + y,

                        roomCenter.z + z

                    );


                    this.rootGroup.add(
                        wall
                    );


                    return wall;
                };


            // =================================
            // FLOOR
            // RADIAL OUTWARD (+Z)
            // =================================

            makeWall(

                width,
                depth,
                wallThickness,

                0,
                0,
                height / 2,

                floorMaterial
            );


            // =================================
            // CEILING
            // RADIAL INWARD (-Z)
            // =================================

            makeWall(

                width,
                depth,
                wallThickness,

                0,
                0,
                -height / 2
            );


            // =================================
            // LEFT WALL
            // =================================

            makeWall(

                wallThickness,
                depth,
                height,

                -width / 2,
                0,
                0
            );


            // =================================
            // FRONT WALL
            // =================================

            makeWall(

                width,
                wallThickness,
                height,

                0,
                -depth / 2,
                0
            );


            // =================================
            // BACK WALL
            // =================================

            makeWall(

                width,
                wallThickness,
                height,

                0,
                depth / 2,
                0
            );


            // =================================
            // RIGHT WALL WITH WINDOW
            // =================================

            const windowWidth = 6;

            const windowHeight = 3.5;

            const windowCenterZ = 0;


            // --------------------------------
            // SIDES OF WINDOW
            // --------------------------------

            const sideDepth =
                (
                    depth -
                    windowWidth
                ) / 2;


            makeWall(

                wallThickness,
                sideDepth,
                height,

                width / 2,

                -(
                    windowWidth / 2 +
                    sideDepth / 2
                ),

                0
            );


            makeWall(

                wallThickness,
                sideDepth,
                height,

                width / 2,

                (
                    windowWidth / 2 +
                    sideDepth / 2
                ),

                0
            );


            // =================================
            // ABOVE WINDOW
            // toward ceiling (-Z)
            // =================================

            const ceilingEdge =
                -height / 2;


            const windowTop =
                windowCenterZ -
                windowHeight / 2;


            const topHeight =
                windowTop -
                ceilingEdge;


            makeWall(

                wallThickness,
                windowWidth,
                topHeight,

                width / 2,
                0,

                ceilingEdge +
                topHeight / 2
            );


            // =================================
            // BELOW WINDOW
            // toward floor (+Z)
            // =================================

            const floorEdge =
                height / 2;


            const windowBottom =
                windowCenterZ +
                windowHeight / 2;


            const bottomHeight =
                floorEdge -
                windowBottom;


            makeWall(

                wallThickness,
                windowWidth,
                bottomHeight,

                width / 2,
                0,

                windowBottom +
                bottomHeight / 2
            );


            // =================================
            // WINDOW FRAME
            // =================================

            const frameMaterial =
                new THREE.MeshStandardMaterial({

                    color: 0x22252a,

                    metalness: 0.7,

                    roughness: 0.3
                });


            const frameThickness = 0.12;

            const frameDepth = 0.25;


            // top

function tileBoxUVs(
    geometry,
    width,
    height,
    depth,
    tileSize
) {

    const uv =
        geometry.attributes.uv;


    function setFace(
        start,
        uRepeat,
        vRepeat
    ) {

        uRepeat =
            Math.max(
                1,
                uRepeat
            );

        vRepeat =
            Math.max(
                1,
                vRepeat
            );


        uv.setXY(
            start + 0,
            0,
            vRepeat
        );

        uv.setXY(
            start + 1,
            uRepeat,
            vRepeat
        );

        uv.setXY(
            start + 2,
            0,
            0
        );

        uv.setXY(
            start + 3,
            uRepeat,
            0
        );
    }


    // +X
    setFace(
        0,
        depth / tileSize,
        height / tileSize
    );

    // -X
    setFace(
        4,
        depth / tileSize,
        height / tileSize
    );

    // +Y
    setFace(
        8,
        width / tileSize,
        depth / tileSize
    );

    // -Y
    setFace(
        12,
        width / tileSize,
        depth / tileSize
    );

    // +Z
    setFace(
        16,
        width / tileSize,
        height / tileSize
    );

    // -Z
    setFace(
        20,
        width / tileSize,
        height / tileSize
    );


    uv.needsUpdate = true;
}

mirrorSceneData.getMirrorCorners =
    function (mirror) {

        const geometry =
            mirror.geometry;

        const positions =
            geometry.attributes.position;


        geometry.computeBoundingBox();

        // The inhabited/front surface of the
        // mirror is the +X face.
        const frontX =
            geometry.boundingBox.max.x;


        const tolerance = 0.0001;

        const corners = [];


        for (
            let i = 0;
            i < positions.count;
            i++
        ) {

            const x =
                positions.getX(i);

            // Only look at vertices on
            // the front face.
            if (
                Math.abs(
                    x - frontX
                ) > tolerance
            ) {
                continue;
            }


            const y =
                positions.getY(i);

            const z =
                positions.getZ(i);


            // ExtrudeGeometry duplicates
            // vertices internally, so remove
            // duplicates.
            const alreadyExists =
                corners.some(
                    corner =>
                        Math.abs(corner.y - y) <
                        tolerance &&
                        Math.abs(corner.z - z) <
                        tolerance
                );


            if (!alreadyExists) {

                corners.push(
                    new THREE.Vector3(
                        x,
                        y,
                        z
                    )
                );
            }
        }


        // Put them in perimeter order.
        // Important later for connecting
        // neighboring cities.
        let centerY = 0;
        let centerZ = 0;

        for (const corner of corners) {

            centerY += corner.y;
            centerZ += corner.z;
        }

        centerY /= corners.length;
        centerZ /= corners.length;


        corners.sort(
            (a, b) => {

                const angleA =
                    Math.atan2(
                        a.z - centerZ,
                        a.y - centerY
                    );

                const angleB =
                    Math.atan2(
                        b.z - centerZ,
                        b.y - centerY
                    );

                return angleA - angleB;
            }
        );


        // Geometry coordinates need to be
        // converted into this child scene's
        // scaled mirror coordinates.
        for (const corner of corners) {

            corner.x *=
                mirror.scale.x;

            corner.y *=
                mirror.scale.y;

            corner.z *=
                mirror.scale.z;
        }


        return corners;
    };

mirrorSceneData.pointInsideMirror =
    function (
        y,
        z,
        corners
    ) {

        let inside = false;


        for (
            let i = 0,
            j = corners.length - 1;
            i < corners.length;
            j = i++
        ) {

            const yi =
                corners[i].y;

            const zi =
                corners[i].z;

            const yj =
                corners[j].y;

            const zj =
                corners[j].z;


            const intersects =
                (
                    (zi > z) !==
                    (zj > z)
                )
                &&
                (
                    y <
                    (
                        (yj - yi) *
                        (z - zi) /
                        (zj - zi)
                        +
                        yi
                    )
                );


            if (intersects) {

                inside =
                    !inside;
            }
        }


        return inside;
    };

            new THREE.Vector3();

        const direction =
            new THREE.Vector3();

            new THREE.Vector3();


        for (
            const connection
            of this.dotConnections
        ) {

            connection.phase +=
                deltaTime *
                connection.speed;

            connection.phase %= 1;


            connection.a.getWorldPosition(
                a

                b
            );


            this.rootGroup.worldToLocal(
                a

                b
            );

                    b,
                    a
                );

            // in the mirror's Y/Z plane.
            perpendicular.set(

                0,

                -direction.z,

                direction.y
            );


            if (
                perpendicular.lengthSq() >
                0.00001
            ) {

                perpendicular
                    .normalize()
                    .multiplyScalar(
                        0.035
                    );
            }


            const positions =
                connection.dots
                    .geometry
                    .attributes
                    .position;


            const count =
                connection
                    .dotsPerDirection;


            // -----------------------------
            // FORWARD TRAFFIC
            // -----------------------------

            for (
                let i = 0;
                i < count;
                i++
            ) {

                const t =
                    (
                        i / count +
                        connection.phase
                    ) % 1;


                positions.setXYZ(

                    i,

                    THREE.MathUtils.lerp(
                        a.x,
                        b.x,
                        t
                    ) +
                    perpendicular.x,

                    THREE.MathUtils.lerp(
                        a.y,
                        b.y,
                        t
                    ) +
                    perpendicular.y,

                    THREE.MathUtils.lerp(
                        a.z,
                        b.z,
                        t
                    ) +
                    perpendicular.z
                );
            }


            // -----------------------------
            // RETURN TRAFFIC
            // -----------------------------

            for (
                let i = 0;
                i < count;
                i++
            ) {

                let t =
                    (
                        i / count -
                        connection.phase
                    ) % 1;

                if (t < 0) {
                    t += 1;
                }


                positions.setXYZ(

                    count + i,

                    THREE.MathUtils.lerp(
                        a.x,
                        b.x,
                        t
                    ) -
                    perpendicular.x,

                    THREE.MathUtils.lerp(
                        a.y,
                        b.y,
                        t
                    ) -
                    perpendicular.y,

                    THREE.MathUtils.lerp(

function makeHighDefStar(radius, coreColor, glowColor) {

    const group = new THREE.Group();

    const core = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 48, 48),

        new THREE.MeshStandardMaterial({
            color: coreColor,
            emissive: coreColor,

            metalness: 0,
            roughness: 0.8
        })
    );


    // Tight glow
    const glow1 =
        makeGlowingSphere(
            radius * 1.6,
            glowColor
        );

    glow1.material.opacity = 0.45;


    // Medium corona
    const glow2 =
        makeGlowingSphere(
            radius * 3.0,
            glowColor
        );

    glow2.material.opacity = 0.15;


    // Huge bright glare
    const glare =
        makeGlowingSphere(

            0xffffff
        );

    glare.material.opacity = 0.8;
    glare.material.depthTest = false;
    glare.material.depthWrite = false;


    group.add(glare);
    group.add(glow2);
    group.add(glow1);
    group.add(core);

    return group;
}

function makeIrregularNgonGeometry(
    width,
    height,
    thickness,
    sides
) {

    const points = [];

    for (let i = 0; i < sides; i++) {

        // Base angle around the polygon
        const angle =
            (i / sides) *
            Math.PI *
            2;

        // Random distance from center.
        // This is what gives us unequal side lengths.
        const radius =
            0.65 +
            Math.random() * 0.35;

        const x =
            Math.cos(angle) *
            width *
            0.5 *
            radius;

        const y =
            Math.sin(angle) *
            height *
            0.5 *
            radius;

        points.push(
            new THREE.Vector2(
                x,
                y
            )
        );
    }


    const shape =
        new THREE.Shape(points);


    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth: thickness,
                bevelEnabled: false
            }
        );


    // ExtrudeGeometry is thin along Z by default.
    //
    // Rotate it so the thin direction becomes X,
    // matching your old BoxGeometry:
    //
    // X = thickness / points toward sun
    // Y = polygon height
    // Z = polygon width
    geometry.rotateY(
        Math.PI / 2
    );


    // Put the polygon's center at its local origin.
    geometry.center();


    return geometry;
}

function randomGaussian() {
    let u = 0;
    let v = 0;

    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();

    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

                right,
                target,
                axis
            ) {

                while (
                    left < right
                ) {

                    let pivotIndex =
                        (left + right) >> 1;


                    pivotIndex =
                        partition(
                            left,
                            right,
                            pivotIndex,
                            axis
                        );


                    if (
                        target ===
                        pivotIndex
                    ) {
                        return;
                    }


                    if (
                        target <
                        pivotIndex
                    ) {

                        right =
                            pivotIndex - 1;

                    } else {

                        left =
                            pivotIndex + 1;
                    }
                }
            }


            function buildTree(
                left,
                right,
                depth
            ) {

                if (
                    left > right
                ) return;


                const middle =
                    (left + right) >> 1;


                quickSelect(
                    left,
                    right,
                    middle,
                    depth % 3
                );


                buildTree(
                    left,
                    middle - 1,
                    depth + 1
                );


                buildTree(
                    middle + 1,
                    right,
                    depth + 1
                );
            }


            console.log(
                "Worker: building KD tree"
            );


            buildTree(
                0,
                count - 1,
                0
            );



            // ========================================
            // NEAREST NEIGHBOR SEARCH
            // ========================================

            const nearestIndices =
                new Int32Array(
                    neighborCount
                );


            const nearestDistances =
                new Float64Array(
                    neighborCount
                );


            let nearestSize = 0;
            let worstSlot = 0;
            let worstDistance =
                Infinity;


            let targetIndex = 0;
            let targetX = 0;
            let targetY = 0;
            let targetZ = 0;


            function refreshWorst() {

                if (
                    nearestSize <
                    neighborCount
                ) {

                    worstDistance =
                        Infinity;

                    worstSlot =
                        nearestSize;

                    return;
                }


                worstSlot = 0;

                worstDistance =
                    nearestDistances[0];


                for (
                    let i = 1;
                    i < nearestSize;
                    i++
                ) {

                    if (
                        nearestDistances[i] >
                        worstDistance
                    ) {

                        worstDistance =
                            nearestDistances[i];

                        worstSlot = i;
                    }
                }
            }


            function consider(
                pointIndex
            ) {

                if (
                    pointIndex ===
                    targetIndex
                ) return;


                const offset =
                    pointIndex * 3;


                const dx =
                    positions[offset] -
                    targetX;

                const dy =
                    positions[offset + 1] -
                    targetY;

                const dz =
                    positions[offset + 2] -
                    targetZ;


                const distanceSquared =
                    dx * dx +
                    dy * dy +
                    dz * dz;


                if (
                    nearestSize <
                    neighborCount
                ) {

                    nearestIndices[
                        nearestSize
                    ] = pointIndex;

                    nearestDistances[
                        nearestSize
                    ] = distanceSquared;


                    nearestSize++;

                    refreshWorst();

                } else if (
                    distanceSquared <
                    worstDistance
                ) {

                    nearestIndices[
                        worstSlot
                    ] = pointIndex;

                    nearestDistances[
                        worstSlot
                    ] = distanceSquared;


                    refreshWorst();
                }
            }


            function searchTree(
                left,
                right,
                depth
            ) {

                if (
                    left > right
                ) return;


                const middle =
                    (left + right) >> 1;

                const pointIndex =
                    indices[middle];

                const axis =
                    depth % 3;


                const targetCoordinate =
                    axis === 0
                        ? targetX
                        : axis === 1
                            ? targetY
                            : targetZ;


                const difference =
                    targetCoordinate -
                    positions[
                        pointIndex * 3 +
                        axis
                    ];


                if (
                    difference <= 0
                ) {

                    searchTree(
                        left,
                        middle - 1,
                        depth + 1
                    );


                    consider(
                        pointIndex
                    );


                    if (
                        difference *
                        difference <
                        worstDistance
                    ) {

                        searchTree(
                            middle + 1,
                            right,
                            depth + 1
                        );
                    }

                } else {

                    searchTree(
                        middle + 1,
                        right,
                        depth + 1
                    );


                    consider(
                        pointIndex
                    );


                    if (
                        difference *
                        difference <
                        worstDistance
                    ) {

                        searchTree(
                            left,
                            middle - 1,
                            depth + 1
                        );
                    }
                }
            }



            // ========================================
            // BUILD UNIQUE CONNECTION LIST
            // ========================================

            const edgeSet =
                new Set();


            for (
                targetIndex = 0;
                targetIndex < count;
                targetIndex++
            ) {

                const offset =
                    targetIndex * 3;


                targetX =
                    positions[offset];

                targetY =
                    positions[offset + 1];

                targetZ =
                    positions[offset + 2];


                nearestSize = 0;

                worstSlot = 0;

                worstDistance =
                    Infinity;


                searchTree(
                    0,
                    count - 1,
                    0
                );


                for (
                    let i = 0;
                    i < nearestSize;
                    i++
                ) {

                    const neighbor =
                        nearestIndices[i];


                    const low =
                        Math.min(
                            targetIndex,
                            neighbor
                        );

                    const high =
                        Math.max(
                            targetIndex,
                            neighbor
                        );


                    edgeSet.add(
                        low * count +
                        high
                    );
                }
            }



            // ========================================
            // CREATE LINE BUFFERS
            // ========================================

            const edgeCount =
                edgeSet.size;


            const linePositions =
                new Float32Array(
                    edgeCount * 6
                );


            const lineColors =
                new Float32Array(
                    edgeCount * 6
                );


            let writeOffset = 0;


            for (
                const key of edgeSet
            ) {

                const first =
                    Math.floor(
                        key / count
                    );

                const second =
                    key -
                    first * count;


                const a =
                    first * 3;

                const b =
                    second * 3;


                const dx =
                    positions[a] -
                    positions[b];

                const dy =
                    positions[a + 1] -
                    positions[b + 1];

                const dz =
                    positions[a + 2] -
                    positions[b + 2];


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy +
                        dz * dz
                    );


                // Exact old-galaxy brightness logic
                const intensity =
                    Math.max(
                        0.055,
                        Math.min(
                            0.72,
                            1.1 /
                            (
                                1 +
                                distance *
                                0.075
                            )
                        )
                    );


                linePositions[
                    writeOffset
                ] =
                    positions[a];

                linePositions[
                    writeOffset + 1
                ] =
                    positions[a + 1];

                linePositions[
                    writeOffset + 2
                ] =
                    positions[a + 2];


                linePositions[
                    writeOffset + 3
                ] =
                    positions[b];

                linePositions[
                    writeOffset + 4
                ] =
                    positions[b + 1];

                linePositions[
                    writeOffset + 5
                ] =
                    positions[b + 2];


                const redBrightness =
                    intensity * 0.2;


                lineColors[
                    writeOffset
                ] =
                    redBrightness;

                lineColors[
                    writeOffset + 1
                ] =
                    redBrightness *
                    0.025;

                lineColors[
                    writeOffset + 2
                ] = 0;


                lineColors[
                    writeOffset + 3
                ] =
                    redBrightness;

                lineColors[
                    writeOffset + 4
                ] =
                    redBrightness *
                    0.025;

                lineColors[
                    writeOffset + 5
                ] = 0;


                writeOffset += 6;
            }


            self.postMessage(
                {
                    edgeCount,

                    positionsBuffer:
                        linePositions.buffer,

                    colorsBuffer:
                        lineColors.buffer
                },
                [
                    linePositions.buffer,
                    lineColors.buffer
                ]
            );
        };

    `;



    // ========================================
    // START WORKER
    // ========================================

    const blob =
        new Blob(
            [workerSource],
            {
                type:
                    "text/javascript"
            }
        );


    const url =
        URL.createObjectURL(

        );


    const worker =
        new Worker(url);


    worker.onmessage =
        event => {

            console.log(

            );


            const geometry =
                new THREE.BufferGeometry();


            geometry.setAttribute(
                "position",
                new THREE.BufferAttribute(

                            .positionsBuffer
                    ),

                )
            );


            geometry.setAttribute(
                "color",
                new THREE.BufferAttribute(
                    new Float32Array(
                        event.data
                            .colorsBuffer
                    ),

                )
            );


            geometry.computeBoundingSphere();


            const material =

                });


            const lines =

                    geometry,
                    material
                );


            // IMPORTANT:
            // lines live in the SAME group as stars,
            // so tilt + galaxy rotation happen automatically.
            group.add(lines);


            worker.terminate();

            URL.revokeObjectURL(
                url
            );
        };


    worker.onerror =
        error => {

            console.error(
                "Galaxy connection worker failed:",
                error
            );

            worker.terminate();

            URL.revokeObjectURL(
                url
            );
        };


    // COPY IT!

    const positionCopy =

        {

        ]
    );

}

const galaxySceneData = new GalaxySceneData({

    scale: 1,

    timescale: 1,

    disapearDistance: 5,

    childScenes: [
        solarSystemSceneData
    ],

    getSubSceneData: function (star) {
        return solarSystemSceneData;
    },

    populateScene: function () {

        const STAR_COUNT = 50000;
        const GALAXY_RADIUS = 650;
        const GALAXY_THICKNESS = 48;
        const ARM_COUNT = 2;

        const group = new THREE.Group();

        const positions = new Float32Array(STAR_COUNT * 3);
        const colors = new Float32Array(STAR_COUNT * 3);
        const color = new THREE.Color();

        for (let i = 0; i < STAR_COUNT; i++) {
            const i3 = i * 3;
            const component = Math.random();

            let x;
            let y;
            let z;
            let radius;
            let temperature;

            if (component < 0.72) {
                // Spiral disk
                radius = Math.pow(Math.random(), 0.52) * GALAXY_RADIUS;

                const arm = Math.floor(Math.random() * ARM_COUNT);
                const armBase = arm * (Math.PI * 2 / ARM_COUNT);
                const winding = radius * 0.018;
                const spread =
                    0.20 +
                    Math.pow(radius / GALAXY_RADIUS, 1.2) * 0.1;

                const angle =
                    armBase +
                    winding +
                    randomGaussian() * spread;

                const radialScatter =
                    randomGaussian() * (8 + radius * 0.035);

                const scatteredRadius =
                    radius + radialScatter;

                x = Math.cos(angle) * scatteredRadius;
                z = Math.sin(angle) * scatteredRadius;

                const diskHeight =
                    3.5 +
                    (1 - radius / GALAXY_RADIUS) * GALAXY_THICKNESS;

                y = randomGaussian() * diskHeight;

                // Outer arms skew slightly blue; inner stars skew warm
                temperature =
                    Math.random() +
                    (radius / GALAXY_RADIUS) * 0.45;

            } else if (component < 0.93) {
                // Dense central bulge
                radius = Math.pow(Math.random(), 2.1) * 190;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                x = Math.sin(phi) * Math.cos(theta) * radius * 1.25;
                z = Math.sin(phi) * Math.sin(theta) * radius * 1.25;
                y = Math.cos(phi) * radius * 0.48;

                x += randomGaussian() * 5;
                y += randomGaussian() * 3;
                z += randomGaussian() * 5;

                temperature = Math.random() * 0.72;

            } else {
                // Sparse halo
                radius = Math.pow(Math.random(), 0.34) * GALAXY_RADIUS * 1.18;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                x = Math.sin(phi) * Math.cos(theta) * radius;
                z = Math.sin(phi) * Math.sin(theta) * radius;
                y = Math.cos(phi) * radius * 0.42;

                temperature = Math.random() * 1.25;
            }

            const collider =
                new StarCollider(
                    new THREE.Vector3(x, y, z),
                    group,
                    i
                );

            collider.userData.collisionType =
                "point";

            this.addCollider(collider);

            positions[i3] = x;
            positions[i3 + 1] = y;
            positions[i3 + 2] = z;

            if (temperature < 0.26) {
                color.setRGB(
                    1.00,
                    0.55 + Math.random() * 0.18,
                    0.34
                );
            } else if (temperature < 0.70) {
                color.setRGB(
                    1.00,
                    0.80 + Math.random() * 0.16,
                    0.62 + Math.random() * 0.18
                );
            } else if (temperature < 1.08) {
                const whiteness = 0.84 + Math.random() * 0.16;
                color.setRGB(
                    whiteness,
                    whiteness,
                    1.00
                );
            } else {
                color.setRGB(
                    0.58 + Math.random() * 0.12,
                    0.72 + Math.random() * 0.12,
                    1.00
                );
            }

            const brightness =
                0.42 + Math.random() * 0.58;

            colors[i3] = color.r * brightness;
            colors[i3 + 1] = color.g * brightness;
            colors[i3 + 2] = color.b * brightness;
        }

        const geometry = new THREE.BufferGeometry();

        geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(positions, 3)
        );

        geometry.setAttribute(
            "color",
            new THREE.BufferAttribute(colors, 3)
        );

        geometry.computeBoundingSphere();

        const material = new THREE.PointsMaterial({
            size: .75,
            sizeAttenuation: true,
            map: makeStarTexture(),
            transparent: true,
            opacity: 0.9,
            alphaTest: 0.01,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true,

            fog: false
        });

        const stars = new THREE.Points(geometry, material);

        group.add(stars);

        // Match the tilt from the good version
        group.rotation.x = THREE.MathUtils.degToRad(-8);
        group.rotation.z = THREE.MathUtils.degToRad(5);

        this.rootGroup.add(group);
        this.orbitGroup = group;

        this.connectionWorker =
            buildGalaxyConnectionNetwork(
                positions,
                group,
                6
            );

        // Save if you want colliders later
        this.starPositions = positions;
        this.starColors = colors;
        this.starPoints = stars;
    },

    animate: function (deltaTime) {
        if (!this.orbitGroup) return;

        // Slow it way down
        this.orbitGroup.rotation.y += 0.0006 * deltaTime;
    },
});

function updateActiveScenes(
    deltaTime
) {

    activeSceneStack.forEach(
        (data, i) => {

            // -------------------------
            // SYNC CAMERA
            // -------------------------

            if (i !== 0) {

                data.camera.quaternion.copy(
                    activeSceneStack[0]
                        .camera
                        .quaternion
                );

                data.camera.position
                    .copy(
                        activeSceneStack[0]
                            .camera
                            .position
                    )
                    .multiplyScalar(
                        1 / data.scale
                    );
            }


            // -------------------------
            // UPDATE SCENE FIRST
            // -------------------------

            data.update?.(
                deltaTime
            );


            // updateCameraLock() may have
            // moved the main camera, so sync
            // the child camera once more.
            if (i !== 0) {

                data.camera.quaternion.copy(
                    activeSceneStack[0]
                        .camera
                        .quaternion
                );

                data.camera.position
                    .copy(
                        activeSceneStack[0]
                            .camera
                            .position
                    )
                    .multiplyScalar(
                        1 / data.scale
                    );
            }


            // -------------------------
            // NOW CHECK COLLISION
            // -------------------------

            data.checkCollision?.();
        }
    );
}

function pitchCamera(camera, amount) {

    const activeScene =
        activeSceneStack[
        activeSceneStack.length - 1
        ];


    // --------------------------------
    // NORMAL SPACE CAMERA
    // --------------------------------

    if (
        !(activeScene instanceof HabSceneData)
    ) {

        camera.rotateX(amount);

        return;
    }


    // --------------------------------
    // HAB CAMERA
    // --------------------------------

    const up =
        activeScene.getHabUpWorld();


    const forward =
        new THREE.Vector3(0, 0, -1)
            .applyQuaternion(
                camera.quaternion
            )
            .normalize();


    const currentPitch =
        Math.asin(
            THREE.MathUtils.clamp(
                forward.dot(up),
                -1,
                1
            )
        );


    const maxPitch =
        THREE.MathUtils.degToRad(89);


    const desiredPitch =
        THREE.MathUtils.clamp(
            currentPitch + amount,
            -maxPitch,
            maxPitch
        );


    const allowedAmount =
        desiredPitch - currentPitch;


    camera.rotateX(
        allowedAmount
    );
}

function rollCamera(camera, amount) {

        yawCamera(
            mainCamera,
            -e.movementX * 0.002
        );

        pitchCamera(
            mainCamera,
            -e.movementY * 0.002
        );
    });
}

}
