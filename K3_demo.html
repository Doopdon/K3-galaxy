<!DOCTYPE html>
<html>

<head>
    <title>K3</title>
</head>

<body style="margin: 0; overflow: hidden;">

    <script type="module">

        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js";

        class SpatialHashGrid {

            constructor(cellSize) {
                this.cellSize = cellSize;
                this.cells = new Map();
            }

            getKey(position) {

                const x = Math.floor(position.x / this.cellSize);
                const y = Math.floor(position.y / this.cellSize);
                const z = Math.floor(position.z / this.cellSize);

                return `${x},${y},${z}`;
            }

            add(object, position) {

                const key = this.getKey(position);

                if (!this.cells.has(key)) {
                    this.cells.set(key, []);
                }

                this.cells.get(key).push(object);
            }

            getNearby(position) {

                const cx = Math.floor(position.x / this.cellSize);
                const cy = Math.floor(position.y / this.cellSize);
                const cz = Math.floor(position.z / this.cellSize);

                const results = [];

                for (let x = -1; x <= 1; x++) {
                    for (let y = -1; y <= 1; y++) {
                        for (let z = -1; z <= 1; z++) {

                            const key =
                                `${cx + x},${cy + y},${cz + z}`;

                            const cell =
                                this.cells.get(key);

                            if (cell) {
                                results.push(...cell);
                            }
                        }
                    }
                }

                return results;
            }
        }

        class SceneData {

            constructor({
                scale,
                timescale = 1,
                disapearDistance = 1,
                localUp = new THREE.Vector3(0, 1, 0),
                childScenes = [],
                getSubSceneData,
                populateScene,
                animate
            }) {

                this.scene = new THREE.Scene();

                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );

                this.camera.rotation.order = "YXZ";
                this.camera.position.z = 5;


                // Scene properties
                this.scale = scale;
                this.timescale = timescale;
                this.speedMultiplier = 1;

                this.disapearDistance = disapearDistance;

                this.childScenes = childScenes;


                // Only these objects can be entered
                this.colliders = [];


                // Current thing we're riding
                this.activeCollider = null;
                this.activeSubScene = null;

                this.parentCollider = null;
                this.parentSceneData = null;


                // Previous transform of collider
                this.lastColliderPosition = new THREE.Vector3();
                this.lastColliderQuaternion = new THREE.Quaternion();


                // User supplied behavior
                this.populateSceneFunction = populateScene;
                this.animateFunction = animate;

                if (getSubSceneData) {
                    this.getSubSceneData = getSubSceneData;
                }

                this.rootGroup = new THREE.Group();
                this.scene.add(this.rootGroup);

                this.localUp = localUp.clone().normalize();
            }

            alignCameraUp() {

                const camera = scenesData[0].camera;

                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);

                const up = this.getWorldUp();

                camera.up.copy(up);

                camera.lookAt(
                    camera.position.clone().add(forward)
                );
            }

            getWorldUp() {

                const worldQuaternion = new THREE.Quaternion();

                this.rootGroup.getWorldQuaternion(
                    worldQuaternion
                );

                return this.localUp
                    .clone()
                    .applyQuaternion(worldQuaternion)
                    .normalize();
            }

            addCollider(object) {

                this.colliders.push(object);

                return object;
            }

            updateParentLock() {

                if (!this.parentCollider) return;

                const position = new THREE.Vector3();
                const quaternion = new THREE.Quaternion();

                this.parentCollider.getWorldPosition(position);
                this.parentCollider.getWorldQuaternion(quaternion);

                position.multiplyScalar(
                    this.parentSceneData.scale / this.scale
                );

                this.rootGroup.position.copy(position);
                this.rootGroup.quaternion.copy(quaternion);
            }

            getColliderLocalQuaternion(collider) {

                const colliderWorld = new THREE.Quaternion();
                const rootWorld = new THREE.Quaternion();

                collider.getWorldQuaternion(colliderWorld);
                this.rootGroup.getWorldQuaternion(rootWorld);

                return rootWorld
                    .invert()
                    .multiply(colliderWorld);
            }

            populateScene() {

                this.colliders = [];

                // Clear old child content
                this.rootGroup.clear();

                // Rebuild the scene contents locally around rootGroup
                this.populateSceneFunction?.call(this);
            }

            update(deltaTime) {

                this.updateParentLock();

                const scaledDelta =
                    deltaTime * this.speedMultiplier;

                this.animateFunction?.call(
                    this,
                    scaledDelta
                );

                this.scene.updateMatrixWorld(true);

                this.updateCameraLock();
            }

            getColliders() {
                return this.colliders;
            }

            checkCollision() {

                this.scene.updateMatrixWorld(true);


                // Already inside something
                if (this.activeCollider) {

                    const position = new THREE.Vector3();

                    this.activeCollider.getWorldPosition(position);

                    const distance =
                        this.camera.position.distanceTo(position);


                    if (distance > this.disapearDistance) {
                        this.leaveCollider();
                    }

                    return;
                }


                // Look for something to enter
                for (const collider of this.getColliders()) {

                    const position = new THREE.Vector3();

                    collider.getWorldPosition(position);

                    const distance =
                        this.camera.position.distanceTo(position);


                    if (distance < this.disapearDistance) {

                        this.enterCollider(
                            collider,
                            position
                        );

                        return;
                    }
                }
            }

            enterCollider(collider, worldPosition) {

                const subScene = this.getSubSceneData(collider);


                // Always lock to the collider
                this.activeCollider = collider;
                this.activeSubScene = subScene ?? null;


                // Remember its current transform for camera locking
                collider.getWorldPosition(
                    this.lastColliderPosition
                );

                // Convert from world position into this scene's local frame
                this.rootGroup.worldToLocal(
                    this.lastColliderPosition
                );

                this.lastColliderQuaternion.copy(
                    this.getColliderLocalQuaternion(collider)
                );


                // No deeper scene:
                // stay locked to the object, but don't change the stack
                if (!subScene) {
                    return;
                }


                // Tell the child scene what object/frame it belongs to
                subScene.parentCollider = collider;
                subScene.parentSceneData = this;


                // Hide parent object because we've descended inside it
                collider.visible = false;


                // Position child scene root at the collider
                subScene.updateParentLock();
                subScene.populateScene();

                subScene.alignCameraUp();


                // Add child to active hierarchy
                const index =
                    activeSceneStack.indexOf(this);

                activeSceneStack.splice(index + 1);

                activeSceneStack.push(subScene);




                updateTimeScales();
            }

            leaveCollider() {
                if (!this.activeCollider) return;


                this.activeSubScene?.remove();

                this.activeCollider.visible = true;

                this.activeCollider = null;
                this.activeSubScene = null;


                const index =
                    activeSceneStack.indexOf(this);

                activeSceneStack.splice(index + 1);


                updateTimeScales();

                this.alignCameraUp()
            }

            updateCameraLock() {

                if (!this.activeCollider) return;

                const mainCamera = scenesData[0].camera;


                // ----------------------
                // COLLIDER LOCAL POSITION
                // ----------------------

                const newPosition = new THREE.Vector3();

                this.activeCollider.getWorldPosition(
                    newPosition
                );

                this.rootGroup.worldToLocal(
                    newPosition
                );


                // ----------------------
                // COLLIDER LOCAL ROTATION
                // ----------------------

                const newQuaternion =
                    this.getColliderLocalQuaternion(
                        this.activeCollider
                    );


                // ----------------------
                // TRANSLATION CHANGE
                // ----------------------

                const movement = newPosition
                    .clone()
                    .sub(this.lastColliderPosition);


                // Movement is currently in rootGroup coordinates.
                // Convert its direction back into world coordinates.

                const rootQuaternion =
                    new THREE.Quaternion();

                this.rootGroup.getWorldQuaternion(
                    rootQuaternion
                );

                movement.applyQuaternion(
                    rootQuaternion
                );


                movement.multiplyScalar(
                    this.scale / scenesData[0].scale
                );


                mainCamera.position.add(
                    movement
                );


                // ----------------------
                // ROTATION CHANGE
                // ----------------------

                const rotationChange =
                    newQuaternion
                        .clone()
                        .multiply(
                            this.lastColliderQuaternion
                                .clone()
                                .invert()
                        );


                // rotationChange is local to rootGroup.
                // Convert it into world-space rotation.

                const rootInverse =
                    rootQuaternion
                        .clone()
                        .invert();

                const worldRotationChange =
                    rootQuaternion
                        .clone()
                        .multiply(rotationChange)
                        .multiply(rootInverse);


                // ----------------------
                // ROTATE CAMERA POSITION
                // AROUND THE COLLIDER
                // ----------------------

                const colliderWorldPosition =
                    new THREE.Vector3();

                this.activeCollider.getWorldPosition(
                    colliderWorldPosition
                );

                colliderWorldPosition.multiplyScalar(
                    this.scale / scenesData[0].scale
                );


                const cameraOffset =
                    mainCamera.position
                        .clone()
                        .sub(colliderWorldPosition);


                cameraOffset.applyQuaternion(
                    worldRotationChange
                );


                mainCamera.position
                    .copy(colliderWorldPosition)
                    .add(cameraOffset);


                // Rotate where camera is looking too
                mainCamera.quaternion.premultiply(
                    worldRotationChange
                );


                // ----------------------
                // SAVE FOR NEXT FRAME
                // ----------------------

                this.lastColliderPosition.copy(
                    newPosition
                );

                this.lastColliderQuaternion.copy(
                    newQuaternion
                );
            }

            getSubSceneData(collider) {
                return this.childScenes[0];
            }

            remove() {

                this.activeSubScene?.remove();

                this.rootGroup.clear();

                this.colliders = [];

                this.activeCollider = null;
                this.activeSubScene = null;

                this.parentCollider = null;
                this.parentSceneData = null;
            }

        }

        class HabSceneData extends SceneData {

            constructor(options) {
                super(options);
            }

            getWorldUp() {

                if (!this.activeCollider) {
                    return SceneData.prototype.getWorldUp.call(this);
                }

                const habitat = this.activeCollider;

                const center = new THREE.Vector3();

                habitat.getWorldPosition(center);

                const habitatQuaternion =
                    new THREE.Quaternion();

                habitat.getWorldQuaternion(
                    habitatQuaternion
                );

                const axis =
                    new THREE.Vector3(0, 1, 0)
                        .applyQuaternion(habitatQuaternion)
                        .normalize();

                const cameraPosition =
                    scenesData[0].camera.position
                        .clone()
                        .multiplyScalar(
                            scenesData[0].scale / this.scale
                        );

                const centerToCamera =
                    cameraPosition.clone().sub(center);

                const distanceAlongAxis =
                    centerToCamera.dot(axis);

                const nearestAxisPoint =
                    center.clone().add(
                        axis.clone().multiplyScalar(
                            distanceAlongAxis
                        )
                    );

                return nearestAxisPoint
                    .sub(cameraPosition)
                    .normalize()
                    .negate();
            }
        }

        class GalaxySceneData extends SceneData {
            constructor(options) {
                super(options);
            }
            buildCollisionGrid(
                collisionFrame,
                cellSize = this.disapearDistance * 2
            ) {

                this.collisionFrame = collisionFrame;

                this.collisionGrid =
                    new SpatialHashGrid(cellSize);

                this.scene.updateMatrixWorld(true);

                for (const collider of this.colliders) {

                    const position = new THREE.Vector3();

                    collider.getWorldPosition(position);

                    collisionFrame.worldToLocal(position);

                    this.collisionGrid.add(
                        collider,
                        position
                    );
                }
            }

            getColliders() {
                return this.getNearbyColliders();
            }

            getNearbyColliders() {

                // Small scene / no grid
                if (!this.collisionGrid) {
                    return this.colliders;
                }

                const cameraPosition =
                    this.camera.position.clone();

                // Camera and collisionFrame exist in same scene,
                // so convert camera to the grid's local coordinates.
                this.collisionFrame.worldToLocal(
                    cameraPosition
                );

                return this.collisionGrid.getNearby(
                    cameraPosition
                );
            }
        }

        // Wolrd
        function makeHighDefStar(radius, coreColor, glowColor) {
            const group = new THREE.Group();

            const core = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 24, 24),
                new THREE.MeshBasicMaterial({
                    color: coreColor
                })
            );

            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(radius * 1.8, 24, 24),
                new THREE.MeshBasicMaterial({
                    color: glowColor,
                    transparent: true,
                    opacity: 0.25,
                    depthWrite: false
                })
            );

            group.add(glow);
            group.add(core);

            group.userData.core = core;

            return group;
        }

        function makeGlowingSphere(radius, coreColor, glowColor) {

            const canvas = document.createElement("canvas");
            canvas.width = 64;
            canvas.height = 64;

            const ctx = canvas.getContext("2d");

            const gradient = ctx.createRadialGradient(
                32, 32, 0,
                32, 32, 32
            );

            gradient.addColorStop(0, "rgba(255,255,255,1)");
            gradient.addColorStop(0.15, "rgba(255,255,255,0.7)");
            gradient.addColorStop(0.4, "rgba(255,255,255,0.25)");
            gradient.addColorStop(1, "rgba(255,255,255,0)");

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            const texture =
                new THREE.CanvasTexture(canvas);

            const material =
                new THREE.SpriteMaterial({
                    map: texture,
                    color: glowColor,
                    transparent: true,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });

            const glow =
                new THREE.Sprite(material);

            glow.scale.set(
                radius * 4,
                radius * 4,
                1
            );

            return glow;
        }

        const solarSystemSceneData = new SceneData({

            scale: 0.001,

            timescale: 10,

            disapearDistance: 1.0,

            childScenes: [],

            populateScene: function () {

                const group = new THREE.Group();

                // Random tilt for the whole system
                group.rotation.x = Math.random() * 0.8;
                group.rotation.z = Math.random() * 0.8;

                this.localUp = new THREE.Vector3(0, 1, 0)
                    .applyQuaternion(group.quaternion)
                    .normalize();

                // Glowing sun
                const sun = makeHighDefStar(1.0, 0xffdd66, 0xffaa22);
                group.add(sun);

                this.planetPivots = [];

                const planetCount = 3 + Math.floor(Math.random() * 4);

                for (let i = 0; i < planetCount; i++) {
                    const pivot = new THREE.Group();

                    const radius = 3 + i * 2 + Math.random();
                    const size = 0.25 + Math.random() * 0.35;

                    const color = new THREE.Color().setHSL(
                        Math.random(),
                        0.7,
                        0.5
                    );

                    const planet = new THREE.Mesh(
                        new THREE.SphereGeometry(size, 20, 20),
                        new THREE.MeshBasicMaterial({
                            color: color
                        })
                    );

                    planet.position.x = radius;

                    pivot.rotation.y = Math.random() * Math.PI * 2;
                    pivot.add(planet);
                    group.add(pivot);

                    this.addCollider(planet);

                    this.planetPivots.push({
                        pivot: pivot,
                        speed: 0.3 / Math.sqrt(radius) + Math.random() * 0.1
                    });
                }

                this.rootGroup.add(group);
                this.orbitGroup = group;
            },

            animate: function (deltaTime) {

                if (!this.planetPivots) return;

                for (const orbit of this.planetPivots) {
                    orbit.pivot.rotateY(orbit.speed * deltaTime);
                }
            }
        });


        function makeStarTexture() {

            const canvas =
                document.createElement("canvas");

            canvas.width = 64;
            canvas.height = 64;

            const context =
                canvas.getContext("2d");

            const gradient =
                context.createRadialGradient(
                    32, 32, 0,
                    32, 32, 32
                );

            gradient.addColorStop(
                0.00,
                "rgba(255,255,255,1)"
            );

            gradient.addColorStop(
                0.10,
                "rgba(255,255,255,0.96)"
            );

            gradient.addColorStop(
                0.32,
                "rgba(255,255,255,0.38)"
            );

            gradient.addColorStop(
                1.00,
                "rgba(255,255,255,0)"
            );

            context.fillStyle =
                gradient;

            context.fillRect(
                0,
                0,
                64,
                64
            );

            const texture =
                new THREE.CanvasTexture(
                    canvas
                );

            texture.colorSpace =
                THREE.SRGBColorSpace;

            return texture;
        }

        const galaxySceneData = new GalaxySceneData({

            scale: 1,

            timescale: 1,

            disapearDistance: .1,

            childScenes: [
                solarSystemSceneData
            ],

            getSubSceneData: function (star) {
                return solarSystemSceneData;
            },

            populateScene: function () {

                const group = new THREE.Group();

                const starCount = 100000;
                const galaxyRadius = 40;
                const armCount = 5;

                const positions =
                    new Float32Array(
                        starCount * 3
                    );

                const colors =
                    new Float32Array(
                        starCount * 3
                    );

                const color =
                    new THREE.Color();

                for (let i = 0; i < starCount; i++) {

                    const distance = Math.pow(Math.random(), 0.7) * galaxyRadius;
                    const arm = i % armCount;
                    const armAngle = (arm / armCount) * Math.PI * 2;
                    const twist = distance * 0.18;
                    const spread = (Math.random() - 0.5) * 0.9;

                    const angle = armAngle + twist + spread;

                    const x = Math.cos(angle) * distance;
                    const z = Math.sin(angle) * distance;
                    const y = (Math.random() - 0.5) * 4;

                    const i3 = i * 3;

                    positions[i3] = x;
                    positions[i3 + 1] = y;
                    positions[i3 + 2] = z;
                    
                    colors[i3] =
                        color.r;

                    colors[i3 + 1] =
                        color.g;

                    colors[i3 + 2] =
                        color.b;

                    let coreColor = 0xffffff;
                    let glowColor = 0xaaccff;

                    const r = Math.random();
                    if (r < 0.2) {
                        coreColor = 0xaaccff;
                        glowColor = 0x6699ff;
                    } else if (r < 0.4) {
                        coreColor = 0xffddaa;
                        glowColor = 0xff8844;
                    } else {
                        coreColor = 0xffffff;
                        glowColor = 0xaaccff;
                    }

                    color.setHex(coreColor);

                }

                const geometry =
                    new THREE.BufferGeometry();

                geometry.setAttribute(
                    "position",
                    new THREE.BufferAttribute(
                        positions,
                        3
                    )
                );

                geometry.setAttribute(
                    "color",
                    new THREE.BufferAttribute(
                        colors,
                        3
                    )
                );


                const material =
                    new THREE.PointsMaterial({

                        size: 0.12,

                        sizeAttenuation: true,

                        map: makeStarTexture(),

                        transparent: true,

                        opacity: 0.9,

                        alphaTest: 0.01,

                        depthWrite: false,

                        blending:
                            THREE.AdditiveBlending,

                        vertexColors: true
                    });


                const stars =
                    new THREE.Points(
                        geometry,
                        material
                    );


                group.add(stars);
                // this.colliders = [...stars]

                this.rootGroup.add(group);
                this.orbitGroup = group;

                // Background stars
                const bgCount = 2000;


                // ----------------------
                // Shared background glow
                // ----------------------

                const canvas = document.createElement("canvas");

                canvas.width = 64;
                canvas.height = 64;

                const ctx = canvas.getContext("2d");

                const gradient = ctx.createRadialGradient(
                    32, 32, 0,
                    32, 32, 32
                );

                gradient.addColorStop(
                    0,
                    "rgba(255,255,255,0.8)"
                );

                gradient.addColorStop(
                    0.15,
                    "rgba(255,255,255,0.35)"
                );

                gradient.addColorStop(
                    0.5,
                    "rgba(255,255,255,0.08)"
                );

                gradient.addColorStop(
                    1,
                    "rgba(255,255,255,0)"
                );

                ctx.fillStyle = gradient;
                ctx.fillRect(
                    0,
                    0,
                    64,
                    64
                );


                const backgroundTexture =
                    new THREE.CanvasTexture(canvas);


                const backgroundMaterial =
                    new THREE.SpriteMaterial({

                        map: backgroundTexture,

                        color: 0xffffff,

                        transparent: true,

                        opacity: 0.8,

                        depthWrite: false,

                        blending:
                            THREE.AdditiveBlending,

                        sizeAttenuation: false
                    });


                // ----------------------
                // Background stars
                // ----------------------



                for (let i = 0; i < bgCount; i++) {

                    const distance =
                        150 +
                        Math.random() * 300;

                    const theta =
                        Math.random() *
                        Math.PI *
                        2;

                    const phi =
                        Math.acos(
                            2 * Math.random() - 1
                        );


                    const star =
                        new THREE.Sprite(
                            backgroundMaterial
                        );


                    star.position.set(

                        distance *
                        Math.sin(phi) *
                        Math.cos(theta),

                        distance *
                        Math.cos(phi),

                        distance *
                        Math.sin(phi) *
                        Math.sin(theta)
                    );


                    // Slight size variation
                    const size =
                        0.005 +
                        Math.random() * 0.005;

                    star.scale.set(
                        size,
                        size,
                        1
                    );


                    this.scene.add(star);
                }
            },

            animate: function (deltaTime) {

                if (!this.orbitGroup) return;

                this.orbitGroup.rotation.y += 0.03 * deltaTime;
            }
        });



        // Engine logic 
        const mainSceneData = galaxySceneData;

        const activeSceneStack = [
            mainSceneData
        ];
        // start sim
        const scenesData = [mainSceneData];

        function addChildScenes(parentSceneData) {

            parentSceneData.childScenes.forEach(childScene => {
                scenesData.push(childScene);
            });

            parentSceneData.childScenes.forEach(childScene => {
                addChildScenes(childScene);
            });
        }

        addChildScenes(mainSceneData);

        // Renderer
        const renderer = new THREE.WebGLRenderer();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.autoClear = false;

        document.body.appendChild(renderer.domElement);



        let keys = {};


        function getCurrentUp() {

            const currentScene =
                activeSceneStack[
                activeSceneStack.length - 1
                ];

            return currentScene.getWorldUp();
        }


        // Rotate left/right around the current scene's "north pole"
        function yawCamera(camera, amount) {

            const up = getCurrentUp();

            const rotation =
                new THREE.Quaternion()
                    .setFromAxisAngle(up, amount);

            camera.quaternion.premultiply(rotation);
        }


        // Rotate up/down around the camera's own right axis
        function pitchCamera(camera, amount) {

            const up = getCurrentUp().normalize();

            const forward =
                new THREE.Vector3(0, 0, -1)
                    .applyQuaternion(camera.quaternion)
                    .normalize();


            // Current pitch relative to the current "up"
            const currentPitch = Math.asin(
                THREE.MathUtils.clamp(
                    forward.dot(up),
                    -1,
                    1
                )
            );


            const maxPitch =
                Math.PI / 2 - 0.01;


            // Clamp where we're allowed to end up
            const targetPitch =
                THREE.MathUtils.clamp(
                    currentPitch + amount,
                    -maxPitch,
                    maxPitch
                );


            // Only rotate by the amount we're actually allowed
            const actualAmount =
                targetPitch - currentPitch;


            // Right direction, perpendicular to both
            // where we're looking and the current up axis
            const right =
                forward.clone()
                    .cross(up)
                    .normalize();


            // If we're effectively exactly at a pole,
            // the cross product can become unusably tiny
            if (right.lengthSq() < 0.000001) {
                return;
            }


            const rotation =
                new THREE.Quaternion()
                    .setFromAxisAngle(
                        right,
                        actualAmount
                    );


            camera.quaternion.premultiply(rotation);
        }

        function addEventHandlers() {

            const mainCamera = scenesData[0].camera;


            addEventListener(
                "keydown",
                e => keys[e.key.toLowerCase()] = true
            );

            addEventListener(
                "keyup",
                e => keys[e.key.toLowerCase()] = false
            );


            renderer.domElement.addEventListener(
                "click",
                () => renderer.domElement.requestPointerLock()
            );


            addEventListener("mousemove", e => {

                if (
                    document.pointerLockElement !==
                    renderer.domElement
                ) return;


                yawCamera(
                    mainCamera,
                    -e.movementX * 0.002
                );


                pitchCamera(
                    mainCamera,
                    -e.movementY * 0.002
                );
            });
        }



        let speed = 0.1;


        function moveCamera() {

            const mainCamera = scenesData[0].camera;


            // Movement stays relative to camera
            if (keys["w"])
                mainCamera.translateZ(-speed);

            if (keys["s"])
                mainCamera.translateZ(speed);

            if (keys["a"])
                mainCamera.translateX(-speed);

            if (keys["d"])
                mainCamera.translateX(speed);


            // Speed
            if (keys["f"])
                speed *= 1.1;

            if (keys["r"])
                speed /= 1.1;


            // Keyboard look controls now use the
            // exact same local-up system as the mouse

            if (keys["arrowleft"])
                yawCamera(mainCamera, 0.01);

            if (keys["arrowright"])
                yawCamera(mainCamera, -0.01);

            if (keys["arrowup"])
                pitchCamera(mainCamera, 0.01);

            if (keys["arrowdown"])
                pitchCamera(mainCamera, -0.01);
        }

        scenesData[0].populateScene();

        addEventHandlers();
        const clock = new THREE.Clock();

        function updateTimeScales() {

            let slowdown = 1;

            for (let i = activeSceneStack.length - 1; i >= 0; i--) {

                const sceneData = activeSceneStack[i];

                sceneData.speedMultiplier = 1 / slowdown;

                slowdown *= sceneData.timescale;
            }
        }

        function run() {
            setTimeout(() => {

                const deltaTime = clock.getDelta();

                moveCamera();

                renderer.clear();

                scenesData.forEach((data, i) => {

                    if (i !== 0) {

                        data.camera.rotation.copy(
                            scenesData[0].camera.rotation
                        );

                        data.camera.position
                            .copy(scenesData[0].camera.position)
                            .multiplyScalar(1 / data.scale);

                        renderer.clearDepth();
                    }

                    data.checkCollision?.();

                    data.update?.(deltaTime);

                    renderer.render(
                        data.scene,
                        data.camera
                    );
                });

                const currentScene =
                    activeSceneStack[
                    activeSceneStack.length - 1
                    ];

                const up =
                    currentScene.getWorldUp();

                scenesData[0].camera.up.copy(up);

                run();

            }, 10);
        }

        run();


    </script>
