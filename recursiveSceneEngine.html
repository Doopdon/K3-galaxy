<!DOCTYPE html>
<html>

<head>
    <title>Red Ball</title>
</head>

<body style="margin: 0; overflow: hidden;">

    <script type="module">

        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js";


        class SceneData {

            constructor({
                scale,
                timescale = 1,
                disapearDistance = 1,
                childScenes = [],
                getSubSceneData,
                populateScene,
                animate
            }) {

                this.scene = new THREE.Scene();

                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );

                this.camera.rotation.order = "YXZ";
                this.camera.position.z = 5;


                // Scene properties
                this.scale = scale;
                this.timescale = timescale;
                this.speedMultiplier = 1;

                this.disapearDistance = disapearDistance;

                this.childScenes = childScenes;


                // Only these objects can be entered
                this.colliders = [];


                // Current thing we're riding
                this.activeCollider = null;
                this.activeSubScene = null;


                // Previous transform of collider
                this.lastColliderPosition = new THREE.Vector3();
                this.lastColliderQuaternion = new THREE.Quaternion();


                // User supplied behavior
                this.populateSceneFunction = populateScene;
                this.animateFunction = animate;

                if (getSubSceneData) {
                    this.getSubSceneData = getSubSceneData;
                }
            }

            addCollider(object) {

                this.colliders.push(object);

                return object;
            }

            populateScene(position) {

                this.colliders = [];

                this.populateSceneFunction?.call(
                    this,
                    position
                );
            }

            update(deltaTime) {

                const scaledDelta =
                    deltaTime * this.speedMultiplier;

                this.animateFunction?.call(
                    this,
                    scaledDelta
                );

                this.scene.updateMatrixWorld(true);

                this.updateCameraLock();
            }

            checkCollision() {

                this.scene.updateMatrixWorld(true);


                // Already inside something
                if (this.activeCollider) {

                    const position = new THREE.Vector3();

                    this.activeCollider.getWorldPosition(position);

                    const distance =
                        this.camera.position.distanceTo(position);


                    if (distance > this.disapearDistance) {
                        this.leaveCollider();
                    }

                    return;
                }


                // Look for something to enter
                for (const collider of this.colliders) {

                    const position = new THREE.Vector3();

                    collider.getWorldPosition(position);

                    const distance =
                        this.camera.position.distanceTo(position);


                    if (distance < this.disapearDistance) {

                        this.enterCollider(
                            collider,
                            position
                        );

                        return;
                    }
                }
            }

            enterCollider(collider, worldPosition) {

                const subScene = this.getSubSceneData(collider);


                // Always lock to the collider
                this.activeCollider = collider;
                this.activeSubScene = subScene ?? null;

                collider.getWorldPosition(
                    this.lastColliderPosition
                );

                collider.getWorldQuaternion(
                    this.lastColliderQuaternion
                );


                // If there is no deeper scene, we're done.
                // We still remain locked to the collider.
                if (!subScene) {
                    return;
                }


                // Hide the parent object while we're inside it
                collider.visible = false;


                subScene.populateScene(
                    worldPosition.clone().multiplyScalar(
                        this.scale / subScene.scale
                    )
                );


                const index =
                    activeSceneStack.indexOf(this);

                activeSceneStack.splice(index + 1);

                activeSceneStack.push(subScene);

                updateTimeScales();
            }

            leaveCollider() {

                if (!this.activeCollider) return;


                this.activeSubScene?.remove();

                this.activeCollider.visible = true;

                this.activeCollider = null;
                this.activeSubScene = null;


                const index =
                    activeSceneStack.indexOf(this);

                activeSceneStack.splice(index + 1);


                updateTimeScales();
            }

            updateCameraLock() {

                if (!this.activeCollider) return;


                const newPosition = new THREE.Vector3();
                const newQuaternion = new THREE.Quaternion();


                this.activeCollider.getWorldPosition(
                    newPosition
                );

                this.activeCollider.getWorldQuaternion(
                    newQuaternion
                );


                // ----------------------
                // Translation
                // ----------------------

                const movement = newPosition
                    .clone()
                    .sub(this.lastColliderPosition);


                scenesData[0].camera.position.add(
                    movement.multiplyScalar(
                        this.scale / scenesData[0].scale
                    )
                );


                // ----------------------
                // Rotation
                // ----------------------

                const oldInverse =
                    this.lastColliderQuaternion
                        .clone()
                        .invert();

                const rotationChange =
                    newQuaternion
                        .clone()
                        .multiply(oldInverse);


                scenesData[0].camera.quaternion
                    .premultiply(rotationChange);


                // Save current transform
                this.lastColliderPosition.copy(
                    newPosition
                );

                this.lastColliderQuaternion.copy(
                    newQuaternion
                );
            }

            getSubSceneData(collider) {
                return this.childScenes[0];
            }


            remove() {

                this.childScenes.forEach(
                    child => child.remove()
                );

                this.scene.clear();

                this.colliders = [];

                this.activeCollider = null;
                this.activeSubScene = null;
            }

        }


        const cubeSceneData = new SceneData({

            scale: 0.1,

            // Entering this scene slows its parents 10x
            timescale: 10,

            disapearDistance: 1.5,

            childScenes: [],


            populateScene: function (position) {

                const group = new THREE.Group();

                group.position.copy(position);


                for (let i = 0; i < 4; i++) {

                    const cube = new THREE.Mesh(
                        new THREE.BoxGeometry(1, 1, 1),
                        new THREE.MeshBasicMaterial({
                            color: "yellow"
                        })
                    );


                    // Put four cubes around a circle
                    const angle =
                        (i / 4) * Math.PI * 2;

                    cube.position.set(
                        Math.cos(angle) * 5,
                        0,
                        Math.sin(angle) * 5
                    );


                    group.add(cube);

                    // Cube can be locked onto
                    this.addCollider(cube);
                }


                this.scene.add(group);

                this.orbitGroup = group;
            },


            animate: function (deltaTime) {

                if (!this.orbitGroup) return;

                this.orbitGroup.rotation.y +=
                    1.0 * deltaTime;
            }
        });

        const mainSceneData = new SceneData({

            scale: 1,

            timescale: 1,

            disapearDistance: 1.5,

            childScenes: [
                cubeSceneData
            ],


            getSubSceneData: function (sphere) {

                return cubeSceneData;
            },


            populateScene: function () {

                const group = new THREE.Group();


                for (let i = 0; i < 4; i++) {

                    const sphere = new THREE.Mesh(
                        new THREE.SphereGeometry(1, 32, 32),
                        new THREE.MeshBasicMaterial({
                            color: "green"
                        })
                    );


                    const angle =
                        (i / 4) * Math.PI * 2;

                    sphere.position.set(
                        Math.cos(angle) * 5,
                        0,
                        Math.sin(angle) * 5
                    );


                    group.add(sphere);

                    // Sphere can be entered
                    this.addCollider(sphere);
                }


                this.scene.add(group);

                this.orbitGroup = group;


                // ----------------------
                // Background stars
                // ----------------------

                const starCount = 2000;

                const starPositions =
                    new Float32Array(starCount * 3);

                for (let i = 0; i < starCount; i++) {

                    // Keep stars well outside the test area
                    const distance =
                        100 + Math.random() * 300;

                    const theta =
                        Math.random() * Math.PI * 2;

                    const phi =
                        Math.acos(2 * Math.random() - 1);


                    starPositions[i * 3] =
                        distance * Math.sin(phi) * Math.cos(theta);

                    starPositions[i * 3 + 1] =
                        distance * Math.cos(phi);

                    starPositions[i * 3 + 2] =
                        distance * Math.sin(phi) * Math.sin(theta);
                }


                const starGeometry =
                    new THREE.BufferGeometry();

                starGeometry.setAttribute(
                    "position",
                    new THREE.BufferAttribute(
                        starPositions,
                        3
                    )
                );


                const starMaterial =
                    new THREE.PointsMaterial({
                        color: "white",
                        size: 0.5
                    });


                const stars =
                    new THREE.Points(
                        starGeometry,
                        starMaterial
                    );


                this.scene.add(stars);
            },


            animate: function (deltaTime) {

                if (!this.orbitGroup) return;

                this.orbitGroup.rotation.y +=
                    1.0 * deltaTime;
            }
        });

        const activeSceneStack = [
            mainSceneData
        ];
        // start sim
        const scenesData = [mainSceneData];

        function addChildScenes(parentSceneData) {

            parentSceneData.childScenes.forEach(childScene => {
                scenesData.push(childScene);
            });

            parentSceneData.childScenes.forEach(childScene => {
                addChildScenes(childScene);
            });
        }

        addChildScenes(mainSceneData);


        // Renderer
        const renderer = new THREE.WebGLRenderer();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.autoClear = false;

        document.body.appendChild(renderer.domElement);



        let keys = {};
        function addEventHandlers() {
            let mainCamera = scenesData[0].camera;
            addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
            addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

            renderer.domElement.addEventListener("click", () => renderer.domElement.requestPointerLock());

            addEventListener("mousemove", e => {
                if (document.pointerLockElement !== renderer.domElement) return;

                mainCamera.rotation.y -= e.movementX * 0.002;
                mainCamera.rotation.x -= e.movementY * 0.002;

                mainCamera.rotation.x = Math.max(
                    -Math.PI / 2,
                    Math.min(Math.PI / 2, mainCamera.rotation.x)
                );
            });


        }

        let speed = 0.1;
        function moveCamera() {
            let mainCamera = scenesData[0].camera;
            if (keys["w"]) mainCamera.translateZ(-speed);
            if (keys["s"]) mainCamera.translateZ(speed);
            if (keys["a"]) mainCamera.translateX(-speed);
            if (keys["d"]) mainCamera.translateX(speed);

            if (keys["f"]) speed *= 1.1;
            if (keys["r"]) speed /= 1.1;

            if (keys["arrowup"]) mainCamera.rotation.x += 0.01;
            if (keys["arrowdown"]) mainCamera.rotation.x -= 0.01;
            if (keys["arrowleft"]) mainCamera.rotation.y += 0.01;
            if (keys["arrowright"]) mainCamera.rotation.y -= 0.01;

            mainCamera.rotation.x = Math.max(
                -Math.PI / 2,
                Math.min(Math.PI / 2, mainCamera.rotation.x)
            );
        }

        scenesData[0].populateScene();

        addEventHandlers();
        const clock = new THREE.Clock();

        function updateTimeScales() {

            let slowdown = 1;

            for (let i = activeSceneStack.length - 1; i >= 0; i--) {

                const sceneData = activeSceneStack[i];

                sceneData.speedMultiplier = 1 / slowdown;

                slowdown *= sceneData.timescale;
            }
        }

        function run() {
            setTimeout(() => {

                const deltaTime = clock.getDelta();

                moveCamera();

                renderer.clear();

                scenesData.forEach((data, i) => {

                    if (i !== 0) {

                        data.camera.rotation.copy(
                            scenesData[0].camera.rotation
                        );

                        data.camera.position
                            .copy(scenesData[0].camera.position)
                            .multiplyScalar(1 / data.scale);

                        renderer.clearDepth();
                    }

                    data.checkCollision?.();

                    data.update?.(deltaTime);

                    renderer.render(
                        data.scene,
                        data.camera
                    );
                });

                run();

            }, 10);
        }

        run();


    </script>

</body>

</html>
