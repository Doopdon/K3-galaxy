<!DOCTYPE html>
<html>

<head>
    <title>Red Ball</title>
</head>

<body style="margin: 0; overflow: hidden;">

    <script type="module">

        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js";


        class SceneData {

            constructor({
                scale,
                timescale = 1,
                disapearDistance = 1,
                localUp = new THREE.Vector3(0, 1, 0),
                childScenes = [],
                getSubSceneData,
                populateScene,
                animate
            }) {

                this.scene = new THREE.Scene();

                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );

                this.camera.rotation.order = "YXZ";
                this.camera.position.z = 5;


                // Scene properties
                this.scale = scale;
                this.timescale = timescale;
                this.speedMultiplier = 1;

                this.disapearDistance = disapearDistance;

                this.childScenes = childScenes;


                // Only these objects can be entered
                this.colliders = [];


                // Current thing we're riding
                this.activeCollider = null;
                this.activeSubScene = null;

                this.parentCollider = null;
                this.parentSceneData = null;


                // Previous transform of collider
                this.lastColliderPosition = new THREE.Vector3();
                this.lastColliderQuaternion = new THREE.Quaternion();


                // User supplied behavior
                this.populateSceneFunction = populateScene;
                this.animateFunction = animate;

                if (getSubSceneData) {
                    this.getSubSceneData = getSubSceneData;
                }

                this.rootGroup = new THREE.Group();
                this.scene.add(this.rootGroup);

                this.localUp = localUp.clone().normalize();
            }

            alignCameraUp() {

                const camera = scenesData[0].camera;

                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);

                const up = this.getWorldUp();

                camera.up.copy(up);

                camera.lookAt(
                    camera.position.clone().add(forward)
                );
            }

            getWorldUp() {

                const worldQuaternion = new THREE.Quaternion();

                this.rootGroup.getWorldQuaternion(
                    worldQuaternion
                );

                return this.localUp
                    .clone()
                    .applyQuaternion(worldQuaternion)
                    .normalize();
            }

            addCollider(object) {

                this.colliders.push(object);

                return object;
            }

            updateParentLock() {

                if (!this.parentCollider) return;

                const position = new THREE.Vector3();
                const quaternion = new THREE.Quaternion();

                this.parentCollider.getWorldPosition(position);
                this.parentCollider.getWorldQuaternion(quaternion);

                position.multiplyScalar(
                    this.parentSceneData.scale / this.scale
                );

                this.rootGroup.position.copy(position);
                this.rootGroup.quaternion.copy(quaternion);
            }

            getColliderLocalQuaternion(collider) {

                const colliderWorld = new THREE.Quaternion();
                const rootWorld = new THREE.Quaternion();

                collider.getWorldQuaternion(colliderWorld);
                this.rootGroup.getWorldQuaternion(rootWorld);

                return rootWorld
                    .invert()
                    .multiply(colliderWorld);
            }

            populateScene() {

                this.colliders = [];

                // Clear old child content
                this.rootGroup.clear();

                // Rebuild the scene contents locally around rootGroup
                this.populateSceneFunction?.call(this);
            }

            update(deltaTime) {

                this.updateParentLock();

                const scaledDelta =
                    deltaTime * this.speedMultiplier;

                this.animateFunction?.call(
                    this,
                    scaledDelta
                );

                this.scene.updateMatrixWorld(true);

                this.updateCameraLock();
            }

            checkCollision() {

                this.scene.updateMatrixWorld(true);


                // Already inside something
                if (this.activeCollider) {

                    const position = new THREE.Vector3();

                    this.activeCollider.getWorldPosition(position);

                    const distance =
                        this.camera.position.distanceTo(position);


                    if (distance > this.disapearDistance) {
                        this.leaveCollider();
                    }

                    return;
                }


                // Look for something to enter
                for (const collider of this.colliders) {

                    const position = new THREE.Vector3();

                    collider.getWorldPosition(position);

                    const distance =
                        this.camera.position.distanceTo(position);


                    if (distance < this.disapearDistance) {

                        this.enterCollider(
                            collider,
                            position
                        );

                        return;
                    }
                }
            }

            enterCollider(collider, worldPosition) {

                const subScene = this.getSubSceneData(collider);


                // Always lock to the collider
                this.activeCollider = collider;
                this.activeSubScene = subScene ?? null;


                // Remember its current transform for camera locking
                collider.getWorldPosition(
                    this.lastColliderPosition
                );

                // Convert from world position into this scene's local frame
                this.rootGroup.worldToLocal(
                    this.lastColliderPosition
                );

                this.lastColliderQuaternion.copy(
                    this.getColliderLocalQuaternion(collider)
                );


                // No deeper scene:
                // stay locked to the object, but don't change the stack
                if (!subScene) {
                    return;
                }


                // Tell the child scene what object/frame it belongs to
                subScene.parentCollider = collider;
                subScene.parentSceneData = this;


                // Hide parent object because we've descended inside it
                collider.visible = false;


                // Position child scene root at the collider
                subScene.updateParentLock();
                subScene.populateScene();

                subScene.alignCameraUp();


                // Add child to active hierarchy
                const index =
                    activeSceneStack.indexOf(this);

                activeSceneStack.splice(index + 1);

                activeSceneStack.push(subScene);




                updateTimeScales();
            }

            leaveCollider() {

                if (!this.activeCollider) return;


                this.activeSubScene?.remove();

                this.activeCollider.visible = true;

                this.activeCollider = null;
                this.activeSubScene = null;


                const index =
                    activeSceneStack.indexOf(this);

                activeSceneStack.splice(index + 1);


                updateTimeScales();
            }

            updateCameraLock() {

                if (!this.activeCollider) return;

                const mainCamera = scenesData[0].camera;


                // ----------------------
                // COLLIDER LOCAL POSITION
                // ----------------------

                const newPosition = new THREE.Vector3();

                this.activeCollider.getWorldPosition(
                    newPosition
                );

                this.rootGroup.worldToLocal(
                    newPosition
                );


                // ----------------------
                // COLLIDER LOCAL ROTATION
                // ----------------------

                const newQuaternion =
                    this.getColliderLocalQuaternion(
                        this.activeCollider
                    );


                // ----------------------
                // TRANSLATION CHANGE
                // ----------------------

                const movement = newPosition
                    .clone()
                    .sub(this.lastColliderPosition);


                // Movement is currently in rootGroup coordinates.
                // Convert its direction back into world coordinates.

                const rootQuaternion =
                    new THREE.Quaternion();

                this.rootGroup.getWorldQuaternion(
                    rootQuaternion
                );

                movement.applyQuaternion(
                    rootQuaternion
                );


                movement.multiplyScalar(
                    this.scale / scenesData[0].scale
                );


                mainCamera.position.add(
                    movement
                );


                // ----------------------
                // ROTATION CHANGE
                // ----------------------

                const rotationChange =
                    newQuaternion
                        .clone()
                        .multiply(
                            this.lastColliderQuaternion
                                .clone()
                                .invert()
                        );


                // rotationChange is local to rootGroup.
                // Convert it into world-space rotation.

                const rootInverse =
                    rootQuaternion
                        .clone()
                        .invert();

                const worldRotationChange =
                    rootQuaternion
                        .clone()
                        .multiply(rotationChange)
                        .multiply(rootInverse);


                // ----------------------
                // ROTATE CAMERA POSITION
                // AROUND THE COLLIDER
                // ----------------------

                const colliderWorldPosition =
                    new THREE.Vector3();

                this.activeCollider.getWorldPosition(
                    colliderWorldPosition
                );

                colliderWorldPosition.multiplyScalar(
                    this.scale / scenesData[0].scale
                );


                const cameraOffset =
                    mainCamera.position
                        .clone()
                        .sub(colliderWorldPosition);


                cameraOffset.applyQuaternion(
                    worldRotationChange
                );


                mainCamera.position
                    .copy(colliderWorldPosition)
                    .add(cameraOffset);


                // Rotate where camera is looking too
                mainCamera.quaternion.premultiply(
                    worldRotationChange
                );


                // ----------------------
                // SAVE FOR NEXT FRAME
                // ----------------------

                this.lastColliderPosition.copy(
                    newPosition
                );

                this.lastColliderQuaternion.copy(
                    newQuaternion
                );
            }

            getSubSceneData(collider) {
                return this.childScenes[0];
            }

            remove() {

                this.activeSubScene?.remove();

                this.rootGroup.clear();

                this.colliders = [];

                this.activeCollider = null;
                this.activeSubScene = null;

                this.parentCollider = null;
                this.parentSceneData = null;
            }

        }


        //world
        function createHabitatTexture() {

            const canvas = document.createElement("canvas");

            canvas.width = 256;
            canvas.height = 128;

            const ctx = canvas.getContext("2d");

            // Dark hull
            ctx.fillStyle = "#202830";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bright vertical stripes
            ctx.fillStyle = "#7fdfff";

            for (let x = 0; x < canvas.width; x += 32) {
                ctx.fillRect(x, 0, 6, canvas.height);
            }

            // Horizontal bands
            ctx.fillStyle = "#555555";

            for (let y = 0; y < canvas.height; y += 32) {
                ctx.fillRect(0, y, canvas.width, 3);
            }

            const texture = new THREE.CanvasTexture(canvas);

            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;

            return texture;
        }



        const redSphereSceneData = new SceneData({

            scale: 0.01,

            timescale: 10,

            disapearDistance: 1.5,

            childScenes: [],


            populateScene: function () {

                const group = new THREE.Group();

                // Weird orbital-plane tilt
                group.rotation.x = 0.65;
                group.rotation.z = 0.35;

                this.localUp = new THREE.Vector3(0, 1, 0)
                    .applyQuaternion(group.quaternion)
                    .normalize();


                const habitatTexture =
                    createHabitatTexture();


                for (let i = 0; i < 4; i++) {

                    const cylinder = new THREE.Mesh(

                        new THREE.CylinderGeometry(
                            1,      // top radius
                            1,      // bottom radius
                            4,      // length
                            32      // segments
                        ),

                        new THREE.MeshBasicMaterial({
                            map: habitatTexture
                        })
                    );


                    const angle =
                        (i / 4) * Math.PI * 2;


                    cylinder.position.set(
                        Math.cos(angle) * 5,
                        0,
                        Math.sin(angle) * 5
                    );


                    group.add(cylinder);

                    this.addCollider(cylinder);
                }


                this.rootGroup.add(group);

                this.orbitGroup = group;
            },


            animate: function (deltaTime) {

                if (!this.orbitGroup) return;


                // Whole habitat system orbits
                const axis =
                    new THREE.Vector3(0, 1, 0);

                this.orbitGroup.rotateOnAxis(
                    axis,
                    1.0 * deltaTime
                );


                // Each cylinder spins around its OWN long axis
                for (const habitat of this.orbitGroup.children) {

                    habitat.rotateY(
                        2.0 * deltaTime
                    );
                }
            }
        });
        redSphereSceneData.getWorldUp = function () {

            // If we're not attached to a habitat yet,
            // just use the normal scene up.
            if (!this.activeCollider) {
                return SceneData.prototype.getWorldUp.call(this);
            }

            const habitat = this.activeCollider;


            // Habitat center
            const center = new THREE.Vector3();

            habitat.getWorldPosition(center);


            // Habitat rotation axis:
            // cylinder local Y transformed into world direction
            const habitatQuaternion =
                new THREE.Quaternion();

            habitat.getWorldQuaternion(
                habitatQuaternion
            );

            const axis =
                new THREE.Vector3(0, 1, 0)
                    .applyQuaternion(habitatQuaternion)
                    .normalize();


            // Camera position in THIS scene's coordinates
            const cameraPosition =
                scenesData[0].camera.position
                    .clone()
                    .multiplyScalar(
                        scenesData[0].scale / this.scale
                    );


            // Vector from habitat center to camera
            const centerToCamera =
                cameraPosition.clone().sub(center);


            // Find nearest point on the cylinder's rotation axis
            const distanceAlongAxis =
                centerToCamera.dot(axis);

            const nearestAxisPoint =
                center.clone().add(
                    axis.clone().multiplyScalar(
                        distanceAlongAxis
                    )
                );


            // UP points inward, toward the axis
            return nearestAxisPoint
                .sub(cameraPosition)
                .normalize()
                .negate();
        }

        const cubeSceneData = new SceneData({

            scale: 0.1,

            timescale: 10,

            disapearDistance: 1.5,

            childScenes: [
                redSphereSceneData
            ],

            getSubSceneData: function (cube) {
                return redSphereSceneData;
            },


            populateScene: function () {

                const group = new THREE.Group();

                for (let i = 0; i < 4; i++) {

                    const cube = new THREE.Mesh(
                        new THREE.BoxGeometry(1, 1, 1),
                        new THREE.MeshBasicMaterial({
                            color: "yellow"
                        })
                    );

                    const angle =
                        (i / 4) * Math.PI * 2;

                    cube.position.set(
                        Math.cos(angle) * 5,
                        0,
                        Math.sin(angle) * 5
                    );

                    group.add(cube);

                    this.addCollider(cube);
                }

                this.rootGroup.add(group);

                this.orbitGroup = group;
            },

            animate: function (deltaTime) {

                if (!this.orbitGroup) return;

                this.orbitGroup.rotation.y +=
                    1.0 * deltaTime;
            }
        });

        const mainSceneData = new SceneData({

            scale: 1,

            timescale: 1,

            disapearDistance: 1.5,

            childScenes: [
                cubeSceneData
            ],


            getSubSceneData: function (sphere) {

                return cubeSceneData;
            },


            populateScene: function () {

                const group = new THREE.Group();


                for (let i = 0; i < 4; i++) {

                    const sphere = new THREE.Mesh(
                        new THREE.SphereGeometry(1, 32, 32),
                        new THREE.MeshBasicMaterial({
                            color: "green"
                        })
                    );


                    const angle =
                        (i / 4) * Math.PI * 2;

                    sphere.position.set(
                        Math.cos(angle) * 5,
                        0,
                        Math.sin(angle) * 5
                    );


                    group.add(sphere);

                    // Sphere can be entered
                    this.addCollider(sphere);
                }


                this.scene.add(group);

                this.orbitGroup = group;


                // ----------------------
                // Background stars
                // ----------------------

                const starCount = 2000;

                const starPositions =
                    new Float32Array(starCount * 3);

                for (let i = 0; i < starCount; i++) {

                    // Keep stars well outside the test area
                    const distance =
                        100 + Math.random() * 300;

                    const theta =
                        Math.random() * Math.PI * 2;

                    const phi =
                        Math.acos(2 * Math.random() - 1);


                    starPositions[i * 3] =
                        distance * Math.sin(phi) * Math.cos(theta);

                    starPositions[i * 3 + 1] =
                        distance * Math.cos(phi);

                    starPositions[i * 3 + 2] =
                        distance * Math.sin(phi) * Math.sin(theta);
                }


                const starGeometry =
                    new THREE.BufferGeometry();

                starGeometry.setAttribute(
                    "position",
                    new THREE.BufferAttribute(
                        starPositions,
                        3
                    )
                );


                const starMaterial =
                    new THREE.PointsMaterial({
                        color: "white",
                        size: 0.5
                    });


                const stars =
                    new THREE.Points(
                        starGeometry,
                        starMaterial
                    );


                this.scene.add(stars);
            },


            animate: function (deltaTime) {

                if (!this.orbitGroup) return;

                this.orbitGroup.rotation.y +=
                    1.0 * deltaTime;
            }
        });

        const activeSceneStack = [
            mainSceneData
        ];
        // start sim
        const scenesData = [mainSceneData];

        function addChildScenes(parentSceneData) {

            parentSceneData.childScenes.forEach(childScene => {
                scenesData.push(childScene);
            });

            parentSceneData.childScenes.forEach(childScene => {
                addChildScenes(childScene);
            });
        }

        addChildScenes(mainSceneData);


        // Renderer
        const renderer = new THREE.WebGLRenderer();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.autoClear = false;

        document.body.appendChild(renderer.domElement);



        let keys = {};


        function getCurrentUp() {

            const currentScene =
                activeSceneStack[
                activeSceneStack.length - 1
                ];

            return currentScene.getWorldUp();
        }


        // Rotate left/right around the current scene's "north pole"
        function yawCamera(camera, amount) {

            const up = getCurrentUp();

            const rotation =
                new THREE.Quaternion()
                    .setFromAxisAngle(up, amount);

            camera.quaternion.premultiply(rotation);
        }


        // Rotate up/down around the camera's own right axis
        function pitchCamera(camera, amount) {

            const up = getCurrentUp().normalize();

            const forward =
                new THREE.Vector3(0, 0, -1)
                    .applyQuaternion(camera.quaternion)
                    .normalize();


            // Current pitch relative to the current "up"
            const currentPitch = Math.asin(
                THREE.MathUtils.clamp(
                    forward.dot(up),
                    -1,
                    1
                )
            );


            const maxPitch =
                Math.PI / 2 - 0.01;


            // Clamp where we're allowed to end up
            const targetPitch =
                THREE.MathUtils.clamp(
                    currentPitch + amount,
                    -maxPitch,
                    maxPitch
                );


            // Only rotate by the amount we're actually allowed
            const actualAmount =
                targetPitch - currentPitch;


            // Right direction, perpendicular to both
            // where we're looking and the current up axis
            const right =
                forward.clone()
                    .cross(up)
                    .normalize();


            // If we're effectively exactly at a pole,
            // the cross product can become unusably tiny
            if (right.lengthSq() < 0.000001) {
                return;
            }


            const rotation =
                new THREE.Quaternion()
                    .setFromAxisAngle(
                        right,
                        actualAmount
                    );


            camera.quaternion.premultiply(rotation);
        }

        function addEventHandlers() {

            const mainCamera = scenesData[0].camera;


            addEventListener(
                "keydown",
                e => keys[e.key.toLowerCase()] = true
            );

            addEventListener(
                "keyup",
                e => keys[e.key.toLowerCase()] = false
            );


            renderer.domElement.addEventListener(
                "click",
                () => renderer.domElement.requestPointerLock()
            );


            addEventListener("mousemove", e => {

                if (
                    document.pointerLockElement !==
                    renderer.domElement
                ) return;


                yawCamera(
                    mainCamera,
                    -e.movementX * 0.002
                );


                pitchCamera(
                    mainCamera,
                    -e.movementY * 0.002
                );
            });
        }



        let speed = 0.1;


        function moveCamera() {

            const mainCamera = scenesData[0].camera;


            // Movement stays relative to camera
            if (keys["w"])
                mainCamera.translateZ(-speed);

            if (keys["s"])
                mainCamera.translateZ(speed);

            if (keys["a"])
                mainCamera.translateX(-speed);

            if (keys["d"])
                mainCamera.translateX(speed);


            // Speed
            if (keys["f"])
                speed *= 1.1;

            if (keys["r"])
                speed /= 1.1;


            // Keyboard look controls now use the
            // exact same local-up system as the mouse

            if (keys["arrowleft"])
                yawCamera(mainCamera, 0.01);

            if (keys["arrowright"])
                yawCamera(mainCamera, -0.01);

            if (keys["arrowup"])
                pitchCamera(mainCamera, 0.01);

            if (keys["arrowdown"])
                pitchCamera(mainCamera, -0.01);
        }

        scenesData[0].populateScene();

        addEventHandlers();
        const clock = new THREE.Clock();

        function updateTimeScales() {

            let slowdown = 1;

            for (let i = activeSceneStack.length - 1; i >= 0; i--) {

                const sceneData = activeSceneStack[i];

                sceneData.speedMultiplier = 1 / slowdown;

                slowdown *= sceneData.timescale;
            }
        }

        function run() {
            setTimeout(() => {

                const deltaTime = clock.getDelta();

                moveCamera();

                renderer.clear();

                scenesData.forEach((data, i) => {

                    if (i !== 0) {

                        data.camera.rotation.copy(
                            scenesData[0].camera.rotation
                        );

                        data.camera.position
                            .copy(scenesData[0].camera.position)
                            .multiplyScalar(1 / data.scale);

                        renderer.clearDepth();
                    }

                    data.checkCollision?.();

                    data.update?.(deltaTime);

                    renderer.render(
                        data.scene,
                        data.camera
                    );
                });

                const currentScene =
                    activeSceneStack[
                    activeSceneStack.length - 1
                    ];

                const up =
                    currentScene.getWorldUp();

                scenesData[0].camera.up.copy(up);

                run();

            }, 10);
        }

        run();


    </script>

</body>

</html>
