<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>K3 Galaxy</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
        }
        #ride-help {
            position: fixed;
            top: 16px;
            left: 16px;
            color: #d7eaff;
            background: rgba(0, 10, 25, 0.8);
            padding: 12px 16px;
            border: 1px solid #254c75;
            border-radius: 6px;
            font: 14px/1.6 system-ui, sans-serif;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="ride-help">
        <div id="ride-status">Cube ride</div>
        B: ride / stop following · N: next shuttle<br>
        Hold F: faster time ×1.1 · Hold R: slower time ÷1.1<br>
        Wheel up: faster ×1.1 · Wheel down: slower ÷1.1<br>
        Click + mouse: look around · WASD: fly freely, including out of the shuttle
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Engine -->
    <script src="./k3-scene.js"></script>
    <script src="./k3-game.js"></script>
    <script src="./shuttles.js"></script>

    <!-- Child scenes -->
    <script src="./planet-scenes.js"></script>

    <!-- Parent scene -->
    <script src="./main-scene.js"></script>

    <!-- Start game LAST -->
    <script src="./main.js"></script>

</body>

</html>
