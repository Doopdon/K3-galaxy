<!DOCTYPE html>
<html>

<head>
    <title>Red Ball</title>
</head>

<body style="margin: 0; overflow: hidden;">

    <script type="module">

        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js";


        // Scene
        const sphereScene = new THREE.Scene();

        // Camera
        const sphereCamera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        sphereCamera.rotation.order = "YXZ";
        sphereCamera.position.z = 5;


        const cubeScene = new THREE.Scene();

        const cubeCamera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            2000
        );
        cubeCamera.rotation.order = "YXZ";


        // Renderer
        const renderer = new THREE.WebGLRenderer();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.autoClear = false;

        document.body.appendChild(renderer.domElement);



        // Sphere 
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const material = new THREE.MeshBasicMaterial({
            color: "red"
        });

        function makeBalls(position) {
            for (let i = 0; i < 100; i++) {
                const b = new THREE.Mesh(geometry, material);

                b.position.set(
                    position.x + Math.random() * 20 - 10,
                    position.y + Math.random() * 20 - 10,
                    position.z + Math.random() * 20 - 10
                );

                sphereScene.add(b);
            }
        }



        //cube
        const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);

        const cubeMaterial = new THREE.MeshBasicMaterial({
            color: "blue"
        });

        function makeCube() {
            const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);

            cube.position.set(
                Math.random() * 20 - 10,
                Math.random() * 20 - 10,
                Math.random() * 20 - 10
            );

            cube.userData.visited = false;

            cubeScene.add(cube);
        }

        function checkCubes() {
            for (const cube of cubeScene.children) {

                const distance = cubeCamera.position.distanceTo(cube.position);

                if (distance < 1 && !cube.userData.visited) {
                    sphereScene.clear();

                    for (const otherCube of cubeScene.children) {
                        otherCube.userData.visited = false;
                        otherCube.visible = true;
                    }

                    cube.userData.visited = true;
                    cube.visible = false;

                    makeBalls(cube.position.clone().multiplyScalar(10));

                    console.log("Entered cube!", cube.position);
                }
            }
        }

        for (let i = 0; i < 100; i++) {
            makeCube();
        }


        let keys = {};
        function addEventHandlers() {
            addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
            addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

            renderer.domElement.addEventListener("click", () => renderer.domElement.requestPointerLock());

            addEventListener("mousemove", e => {
                if (document.pointerLockElement !== renderer.domElement) return;

                sphereCamera.rotation.y -= e.movementX * 0.002;
                sphereCamera.rotation.x -= e.movementY * 0.002;

                sphereCamera.rotation.x = Math.max(
                    -Math.PI / 2,
                    Math.min(Math.PI / 2, sphereCamera.rotation.x)
                );
            });


        }

        function moveCamera() {
            if (keys["w"]) sphereCamera.translateZ(-0.1);
            if (keys["s"]) sphereCamera.translateZ(0.1);
            if (keys["a"]) sphereCamera.translateX(-0.1);
            if (keys["d"]) sphereCamera.translateX(0.1);

            if (keys["arrowup"]) sphereCamera.rotation.x += 0.01;
            if (keys["arrowdown"]) sphereCamera.rotation.x -= 0.01;
            if (keys["arrowleft"]) sphereCamera.rotation.y += 0.01;
            if (keys["arrowright"]) sphereCamera.rotation.y -= 0.01;

            sphereCamera.rotation.x = Math.max(
                -Math.PI / 2,
                Math.min(Math.PI / 2, sphereCamera.rotation.x)
            );
        }

        addEventHandlers();

        function run() {
            setTimeout(() => {
                moveCamera();

                cubeCamera.rotation.copy(sphereCamera.rotation);
                cubeCamera.position.copy(sphereCamera.position).multiplyScalar(0.1);
                checkCubes();
                
                
                renderer.clear();
                renderer.render(cubeScene, cubeCamera);
                renderer.clearDepth();
                renderer.render(sphereScene, sphereCamera);

                run();
            }, 10);
        }
        run();


    </script>

</body>

</html>
