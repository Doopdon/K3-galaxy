<!DOCTYPE html>
<html>

<head>
    <title>Red Ball</title>
</head>

<body style="margin: 0; overflow: hidden;">

    <script type="module">

        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js";

        function checkCollision(sceneData, subSceneData) {
            let disapearDistance = sceneData.disapearDistance;
            const cameraPosition = sceneData.camera.position;
            for (const child of sceneData.scene.children) {
                const distance = cameraPosition.distanceTo(child.position);
                // leaving an object
                if (child.userData.visited && distance > disapearDistance) {
                    subSceneData.remove();
                    child.visible = true;
                    child.userData.visited = false;
                }
                // entering an object
                else if (distance < disapearDistance && !child.userData.visited) {
                    subSceneData.scene.clear();
                    for (const otherChild of subSceneData.scene.children) {
                        otherChild.userData.visited = false;
                        otherChild.visible = true;
                    }
                    child.userData.visited = true;
                    child.visible = false;

                    subSceneData.populateScene(child.position.clone().multiplyScalar(
                        sceneData.scale / subSceneData.scale));
                }
            }
        }

        function generateCamera() {
            const camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000);
            camera.rotation.order = "YXZ";
            camera.position.z = 5;
            return camera;
        }

        const yelloCubeSceneData = {
            scene: new THREE.Scene(),
            camera: generateCamera(),
            scale: .001,
            childScenes: [],

            remove: function () {
                this.scene.clear();
            },

            populateScene: function (position) {

                const group = new THREE.Group();

                group.position.copy(position);

                for (let i = 0; i < 10; i++) {

                    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);

                    const cubeMaterial = new THREE.MeshBasicMaterial({
                        color: "yellow"
                    });

                    const cube = new THREE.Mesh(
                        cubeGeometry,
                        cubeMaterial
                    );

                    cube.position.set(
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10
                    );

                    group.add(cube);
                }

                this.scene.add(group);

                this.orbitGroup = group;
            },

            update: function () {
                if (this.orbitGroup) {
                    this.orbitGroup.rotation.y += 0.01;
                }
            }
        }

        // Green Sphere Scene
        const greenSphereSceneData = {
            scene: new THREE.Scene(),
            camera: generateCamera(),
            scale: .01,
            disapearDistance: 1,
            childScenes: [yelloCubeSceneData],
            remove: function () {
                this.scene.clear();
                this.childScenes.forEach((scene) => scene.remove());
            },
            checkCollision: function () {
                checkCollision(this, this.childScenes[0])
            },
            populateScene: function (position) {
                console.log("Populating green sphere scene at", position);
                for (let i = 0; i < 10; i++) {
                    const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);
                    const sphereMaterial = new THREE.MeshBasicMaterial({
                        color: "green"
                    });
                    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);

                    sphere.position.set(
                        position.x + Math.random() * 20 - 10,
                        position.y + Math.random() * 20 - 10,
                        position.z + Math.random() * 20 - 10
                    );

                    this.scene.add(sphere);
                }
            }
        }

        // Sphere Scene
        const sphereSceneData = {
            scene: new THREE.Scene(),
            camera: generateCamera(),
            scale: .1,
            disapearDistance: 1,
            childScenes: [greenSphereSceneData],
            remove: function () {
                this.scene.clear();
                this.childScenes.forEach((scene) => scene.remove());
            },
            populateScene: function (position) {
                for (let i = 0; i < 10; i++) {
                    const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);
                    const sphereMaterial = new THREE.MeshBasicMaterial({
                        color: "red"
                    });
                    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);

                    sphere.position.set(
                        position.x + Math.random() * 20 - 10,
                        position.y + Math.random() * 20 - 10,
                        position.z + Math.random() * 20 - 10
                    );

                    this.scene.add(sphere);
                }
            },
            checkCollision: function () {
                checkCollision(this, this.childScenes[0])
            }
        }


        // Cube Scene
        const cubeSceneData = {
            scene: new THREE.Scene(),
            camera: generateCamera(),
            scale: 1,
            disapearDistance: 1,
            childScenes: [sphereSceneData],
            checkCollision: function () {
                checkCollision(this, this.childScenes[0])
            },
            populateScene: function () {
                for (let i = 0; i < 100; i++) {
                    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
                    const cubeMaterial = new THREE.MeshBasicMaterial({
                        color: "blue"
                    });
                    const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);

                    cube.position.set(
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10,
                        Math.random() * 20 - 10
                    );

                    cube.userData.visited = false;

                    this.scene.add(cube);
                }
            }
        }



        const scenesData = [cubeSceneData];

        function addChildScenes(parentSceneData) {
            // two loops to add child scenes and their children recursively
            parentSceneData.childScenes.forEach(childScene => {
                scenesData.push(childScene);
            });
            parentSceneData.childScenes.forEach(childScene => {
                addChildScenes(childScene);
            });
        }

        addChildScenes(cubeSceneData)


        // Renderer
        const renderer = new THREE.WebGLRenderer();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.autoClear = false;

        document.body.appendChild(renderer.domElement);



        let keys = {};
        function addEventHandlers() {
            let mainCamera = scenesData[0].camera;
            addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
            addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

            renderer.domElement.addEventListener("click", () => renderer.domElement.requestPointerLock());

            addEventListener("mousemove", e => {
                if (document.pointerLockElement !== renderer.domElement) return;

                mainCamera.rotation.y -= e.movementX * 0.002;
                mainCamera.rotation.x -= e.movementY * 0.002;

                mainCamera.rotation.x = Math.max(
                    -Math.PI / 2,
                    Math.min(Math.PI / 2, mainCamera.rotation.x)
                );
            });


        }

        let speed = 0.1;
        function moveCamera() {
            let mainCamera = scenesData[0].camera;
            if (keys["w"]) mainCamera.translateZ(-speed);
            if (keys["s"]) mainCamera.translateZ(speed);
            if (keys["a"]) mainCamera.translateX(-speed);
            if (keys["d"]) mainCamera.translateX(speed);

            if (keys["f"]) speed *= 1.1;
            if (keys["r"]) speed /= 1.1;

            if (keys["arrowup"]) mainCamera.rotation.x += 0.01;
            if (keys["arrowdown"]) mainCamera.rotation.x -= 0.01;
            if (keys["arrowleft"]) mainCamera.rotation.y += 0.01;
            if (keys["arrowright"]) mainCamera.rotation.y -= 0.01;

            mainCamera.rotation.x = Math.max(
                -Math.PI / 2,
                Math.min(Math.PI / 2, mainCamera.rotation.x)
            );
        }

        scenesData[0].populateScene();

        addEventHandlers();

        function run() {
            setTimeout(() => {
                moveCamera();

                renderer.clear();
                scenesData.forEach((data, i) => {
                    if (i !== 0) {
                        data.camera.rotation.copy(scenesData[0].camera.rotation);
                        data.camera.position.copy(scenesData[0].camera.position).multiplyScalar(1 / data.scale);
                        renderer.clearDepth();
                    }
                    data.checkCollision?.();
                    data.update?.();
                    
                    renderer.render(data.scene, data.camera);
                });
                run();
            }, 10);
        }
        run();


    </script>

</body>

</html>
